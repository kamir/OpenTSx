# Example flow in the form a person writes, opentsx.flow.v1 (no JSON schema): it names signals, not series ids or
# topics. No code translates it into a DAG (docs/datamodel-2026/SYSTEM-DOCUMENT-SPEC.md, section 3). The vector
# processor runs this chain (plausible range, then the mean per minute) as the opentsx.dag.v2 document the workbench
# writes (docs/datamodel-2026/SYSTEM-DOCUMENT-SPEC.md, section 5).
schema: opentsx.flow.v1
flow: turbine-power-clean
reads: ["park/T02/WTUR.W@raw"]
nodes:
  - id: range
    op: dq.plausible-range
    in: [source]
    params: { mode: gap }                   # min and max come from the expectation of the signal
  - id: clean
    op: resample
    in: [range]
    params: { every: PT1M, agg: MEAN }
writes:
  - { from: clean, signal: "park/T02/WTUR.W@clean" }

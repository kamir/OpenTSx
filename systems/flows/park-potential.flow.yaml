# Flow, opentsx.flow.v1 (proposal): the available power of the park, estimated from the clean wind speed over the
# power curve of the turbines. An estimate: it does not fall when the park is curtailed, as the measured power does.
# The processor "model.power-curve" does not exist yet. The power curve of opentsx-windpark is the model to use.
schema: opentsx.flow.v1
flow: park-potential
reads: ["park/T02/WMET.HorWdSpd@clean"]
nodes:
  - id: potential
    op: model.power-curve
    in: [source]
    params: { ratedKw: 12000, turbines: 6 }
writes:
  - { from: potential, signal: "park.p_avail_kw@clean" }

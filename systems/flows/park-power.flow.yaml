# Flow, opentsx.flow.v1 (proposal): the clean active power of the turbines becomes the actual generation of the park.
# This is what was generated, not what was available: under curtailment the two differ (15, section 9).
# A processor "agg.sum" over several series does not exist yet; with one turbine written out the sum is that turbine.
schema: opentsx.flow.v1
flow: park-power
reads: ["park/T02/WTUR.W@clean"]
nodes:
  - id: sum
    op: agg.sum
    in: [source]
    params: { every: PT1M }
writes:
  - { from: sum, signal: "park.p_gen_kw@clean" }

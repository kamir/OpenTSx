# Processor description, schema opentsx.processor.v1. Rendered into docs/user-manual/17-operators.md.
schema: opentsx.processor.v1
id: feature.rolling
version: 1
kind: transformer
category: feature
title: Rolling-window feature
description: >-
  Gives every sample an aggregate of the values of the last window, the current sample included and gaps left out:
  the samples with a time after t - window and up to t. STD is the population standard deviation of those values.
  A feature for models that predict from the recent past.
inputs:
  - { name: in, type: series, cardinality: one }
outputs:
  - { name: out, type: series }
params:
  - { name: window, type: duration, required: true, editAs: seconds, description: Length of the window. }
  - { name: fn, type: enum, values: [MEAN, STD, MIN, MAX], default: MEAN, description: Aggregate of the values in the window. }
semantics: { needs: window, deterministic: true, keeps: [time, unit, series], origin: INHERIT }
runtimes:
  workbench: { status: available, note: "window in units of the x axis, default 3600. Refuses a window of 0 or less, as the processor does." }
  processor: { status: available, class: "org.opentsx.retrieval.clean.CleanChain#Rolling", note: "A step of the clean chain before a series sink (bin/opentsx vectors). Each sample enters and leaves the running sums and the extremes once, so a step costs the same for any window. A step adds up the window afresh when a finite value whose square is no finite number (above about 1.3e154 in magnitude) leaves it, and at every step while the values of the window or their squares add up beyond about 1.8e308. While such a value is in the window or the squares of the window add up beyond about 1.8e308, and the values of the window are finite and not all equal, STD is infinite, or NaN when MEAN is above about 1.3e154 in magnitude or infinite. While the values of the window are finite, add up beyond about 1.8e308 and are not all equal, MEAN is infinite even when their mean is a finite number: 1e308 and 1.5e308 give Infinity, not 1.25e308. While a finite value whose square is no finite number is in the window, MEAN can differ in the last digits from the mean of the window added up afresh. After a resample step the window may span at most 100000 of its intervals; a longer one refuses the DAG with an error that names the node, POST /v1/dags/deploy answers 400 and vectors deploy exits with code 2. Without a resample step before it, a window that holds more than 100000 values fails the sink with an error that names the node. Give a shorter window or resample the series first." }
  java: { status: none }
  python: { status: none }
  go: { status: none }
ui: { group: stream, label: Rolling }
testvectors: docs/datamodel-2026/testvectors/clean-ops.v1.json
example:
  source: opentsx-saas-frontend/src/workbench/examples/feature.rolling.example.test.ts
  chart: docs/user-manual/img/operators/feature.rolling.png
  shows: On a 1 s step from 0 to 10 a 20 s window gives a MEAN that reaches the measured 10 at 19 s after the step and a STD with the measured peak of 5.000 at 9 s, where half the window is 10.

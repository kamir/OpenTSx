schema: opentsx.processor.v1
id: feature.rolling
version: 1
kind: transformer
title: Rolling feature
description: Aggregates the samples in a trailing time window.
inputs:
  - { name: in, type: series, cardinality: one }
outputs:
  - { name: out, type: series }
params:
  - { name: window, type: duration, required: true, editAs: seconds }
  - { name: fn, type: enum, values: [MEAN, STD, MIN, MAX], default: MEAN }
semantics: { needs: window, deterministic: true, keeps: [time, unit, count], origin: INHERIT }
runtimes:
  wayang: { status: available, class: org.opentsx.wayang.TsxSeriesChain }
  rust: { status: available, class: tsx_runner::catalog::Pipeline, note: "tsx-runner 0.1.0 isolated local B2 context. Per-series trailing history and explicit sample/state bounds. No fleet qualification." }
state: { kind: keyed, key: series }
merge: { class: none }
testvectors: docs/datamodel-2026/testvectors/clean-ops.v1.json

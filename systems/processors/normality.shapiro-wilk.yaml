# Processor description, schema opentsx.processor.v1. Rendered into docs/user-manual/17-operators.md.
schema: opentsx.processor.v1
id: normality.shapiro-wilk
version: 1
kind: transformer
category: distribution
title: Shapiro-Wilk normality test
description: >-
  Tests whether the values of a series come from a normal distribution. The statistic
  W = (sum_i a_i x_(i))^2 / sum_i (x_i − m)^2 compares the ordered values x_(i) with the expected order statistics of
  a normal sample through the coefficients a_i, with the mean m. W is close to 1 for normal values and smaller
  otherwise; the p value is the probability of a W this small for normal values.
inputs:
  - { name: in, type: series, cardinality: one }
outputs:
  - { name: result, type: stats, description: W and the p value }
semantics: { needs: series, deterministic: true }
runtimes:
  java:
    status: available
    class: "org.opentsx.algorithms.statistics.Statistical#shapiroWilk"
    note: >-
      The 2.x model in opentsx-core has org.opentsx.algorithms.statistics.Statistical#shapiroWilk(values), a port of
      algorithm AS R94 made for 3 to 5000 values, used by DistributionTester#testDataset and
      TimeSeriesObject#getSWTestResult. No test covers it. It throws for fewer than 3 values and returns W = p = -1
      when all values are equal. Its sort moves the padding value 0 into the data when a value is negative, so W
      changes when a constant is added. The Swing button TEST Normal Distribution draws histograms of W in windows of
      20 to 100 values.
  workbench: { status: none, note: "Listed as not ported (TEST Normal Distribution) in ops.ts NOT_PORTED." }
  python: { status: none }
  processor: { status: none }
  go: { status: none }
literature:
  - "S. S. Shapiro and M. B. Wilk, An analysis of variance test for normality (complete samples), Biometrika 52, 591 (1965)"
  - "P. Royston, Remark AS R94: A remark on algorithm AS 181: The W-test for normality, Appl. Statist. 44, 547 (1995)"

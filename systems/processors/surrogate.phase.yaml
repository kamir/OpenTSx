# Processor description, schema opentsx.processor.v1. Rendered into docs/user-manual/17-operators.md.
schema: opentsx.processor.v1
id: surrogate.phase
version: 1
kind: transformer
category: surrogate
title: Phase-randomized surrogate
description: >-
  Transforms the series with an FFT, multiplies each Fourier coefficient c_k by e^(iφ_k) with a random phase φ_k,
  uniform in [0, 2π), and its mirror c_(N−k) by e^(−iφ_k), and transforms back. The copy has the same power spectrum,
  and so the same linear autocorrelation, as the input; nonlinear structure and the phase relation to any other
  series are lost. A measure that keeps its value on such copies is explained by the spectrum alone.
inputs:
  - { name: in, type: series, cardinality: one }
outputs:
  - { name: out, type: series, description: One surrogate copy as long as the input }
semantics: { needs: series, deterministic: false, keeps: [count] }
runtimes:
  java:
    status: available
    class: "org.opentsx.data.series.TimeSeriesObjectFFT#getModifiedTimeSeries_PhaseRandomized"
    note: >-
      2.x model in opentsx-core: getModifiedTimeSeries_PhaseRandomized(random) on
      TimeSeriesObjectFFT.convertToMessreiheFFT(ts) draws the phases from the java.util.Random it is given; without
      an argument it uses a new Random. Pads to a power of two with zeros and returns the first n values of the inverse
      transform, so for other lengths the result does not keep the amplitude spectrum; keeps the real coefficient at the Nyquist frequency; sets c_0 of the padded values to 0, so
      the result has mean 0 only for a length that is a power of two; opens no window.
      LongTermCorrelationSeriesGenerator.getPhaseRandomizedRow(ts, false, false) calls it without a seed.
      FFTPhaseRandomizer.getPhaseRandomizedRow mode 1 adds random phases the same way, mode 0 permutes the phases of
      the coefficients instead; getPhaseRandomizedModifiedFFT_MULTIPLY_RANDOM_INV(random) and
      getPhaseRandomizedModifiedFFT_SHUFFLED_INV(random) take a seed. TimeSeriesObjectFFTTest checks the amplitude
      spectrum, the change of the series and the seed of all three. Surrogates by phase randomization in a clean-room
      Java library are planned in TASK-015 P8.1.
  workbench: { status: none, note: "The operator shuffle keeps the values and destroys the spectrum." }
  python: { status: none }
  processor: { status: none }
  go: { status: none }
docs: docs/user-manual/11-classic-analytics.md
literature:
  - "J. Theiler, S. Eubank, A. Longtin, B. Galdrikian, J. D. Farmer, Testing for nonlinearity in time series: the method of surrogate data, Physica D 58, 77 (1992)"

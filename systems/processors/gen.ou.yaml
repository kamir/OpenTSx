# Processor description, schema opentsx.processor.v1. Runs in the retrieval server (org.opentsx.retrieval.generate).
schema: opentsx.processor.v1
id: gen.ou
version: 1
kind: generator
fidelity: demo
title: Mean-reverting noise
description: >-
  Values wander around a mean and are pulled back to it. A stand-in for a price or a demand where no data is
  connected. A demo generator: it knows nothing of the rest of the system. Values are clipped to the plausible range
  of the signal.
outputs:
  - { name: out, type: series }
params:
  - { name: mean, type: number, required: true, description: Level the values return to }
  - { name: reversion, type: number, default: 0.1, min: 0, max: 1, description: Share of the distance to the mean taken back per step }
  - { name: sigma, type: number, required: true, min: 0, description: Standard deviation of one step }
  - { name: min, type: number, from: expect.min }
  - { name: max, type: number, from: expect.max }
  - { name: every, type: duration, required: true, from: expect.interval }
  - { name: unit, type: string, from: expect.unit }
semantics: { needs: window, deterministic: true, origin: SYNTHETIC }
runtimes:
  java: { status: available, class: org.opentsx.retrieval.generate.Generators, note: "One run over a period, started by a person; no continuous operation." }
  workbench: { status: none }
  processor: { status: none }
ui: { group: source, label: Mean-reverting noise }

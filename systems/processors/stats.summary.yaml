# Processor description, schema opentsx.processor.v1. Rendered into docs/user-manual/17-operators.md.
schema: opentsx.processor.v1
id: stats.summary
version: 1
kind: transformer
category: statistics
title: Episode summary
description: >-
  Counts the NaN values and keeps count, min, max and Welford's running mean and m2 of the other values:
  delta = x − mean, mean += delta / n, m2 += delta * (x − mean). Two summaries merge exactly (Chan et al.):
  n = na + nb, mean = mean_a + delta * nb / n, m2 = m2_a + m2_b + delta^2 * na * nb / n with delta = mean_b − mean_a.
  The sample variance is m2 / (n − 1). Every episode carries the summary of its values.
inputs:
  - { name: in, type: series, cardinality: one, description: "The values of an episode, or of any array" }
outputs:
  - { name: summary, type: stats, description: "EpisodeSummary: validCount, nanCount, min, max, mean, m2" }
semantics: { needs: window, deterministic: true }
runtimes:
  java: { status: available, class: org.opentsx.model.Summaries, note: "Summaries.of(values), Summaries.merge(a, b), Summaries.variance(s). Episodes.regular(...).build() sets the summary of every episode. Infinite values count as valid." }
  python: { status: available, class: opentsx.model.summary.summarize, note: "summarize(values), merge_summaries(a, b) and variance(s) of opentsx.model, as dicts with the Avro field names. Infinite values count as valid." }
  workbench: { status: none, note: "ops.ts has a helper stats() for n, mean, std, min and max that other operators use; no operator exposes it." }
  processor: { status: none, note: "No processor merges summaries; bin/opentsx stats computes its own moments (stats.welford-ddsketch)." }
  go: { status: planned, note: "Episodes and Welford in the Go stream core of the proposed Go TSx processor." }
plan: { file: EVOLUTION/TASK-016-smart-topics.md, item: P7f }
docs: docs/user-manual/03-data-model.md#33-episodes
literature:
  - "B. P. Welford, Note on a method for calculating corrected sums of squares and products, Technometrics 4, 419 (1962)"
  - "T. F. Chan, G. H. Golub, R. J. LeVeque, Updating formulae and a pairwise algorithm for computing sample variances, Stanford report STAN-CS-79-773 (1979)"
example:
  source: python-package/tests/examples/test_summary_example.py
  chart: docs/user-manual/img/operators/stats.summary.png
  shows: The summaries of two halves of 200 values (mean 0 with 3 NaN, and mean 5) merge into the summary of all 400 values, with the same counts 397 and 3, the same min and max, and mean and standard deviation at most 4e-16 apart relative.

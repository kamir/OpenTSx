# Processor description, schema opentsx.processor.v1. Rendered into docs/user-manual/17-operators.md.
schema: opentsx.processor.v1
id: pattern.similar-episodes
version: 1
kind: transformer
category: pattern
title: Similar episodes
description: >-
  Ranks whole episodes by how much they look like a query episode. Each episode becomes its z-normalized PAA of 64
  values, so episodes of different length, level and scale compare; the distance is the Euclidean distance of these
  representations, or DTW on them. SAX words of 16 letters from an alphabet of 8 bound the Euclidean distance from
  below and skip candidates without changing the result. The query itself and episodes with fewer than 64 values are
  left out.
inputs:
  - { name: in, type: series, cardinality: many, description: "Candidate episodes. Without metric, those of the query's metric." }
outputs:
  - { name: matches, type: events, cardinality: many, description: "PatternMatch per episode, best first: episodeId, seriesId, offset 0, length, distance, metric zED@paa64" }
params:
  - { name: episodeId, type: string, required: true, description: The query episode. }
  - { name: distance, type: enum, values: [zED, DTW], default: zED, description: Euclidean distance of the representations or DTW on them. }
  - { name: band, type: number, default: 0.1, min: 0, max: 1, description: "DTW only: width of the Sakoe-Chiba band as a share of 64." }
  - { name: topK, type: integer, default: 10, min: 1, max: 1000, description: Number of matches. }
  - { name: points, type: integer, default: 64, description: "Java only: length of the representation." }
  - { name: saxLength, type: integer, default: 16, description: "Java only: letters of a SAX word; at most points." }
  - { name: alphabet, type: integer, default: 8, description: "Java only: size of the SAX alphabet." }
semantics: { needs: series, deterministic: true }
runtimes:
  java:
    status: available
    class: org.opentsx.retrieval.pattern.EpisodeSimilarity
    note: >-
      EpisodeService.similarEpisodes(episodeId).topK(k).fetch(); representation(points, saxLength, alphabet) changes
      64, 16 and 8. EpisodeSimilarity.annotate stores the SAX word in EpisodeSummary.sax; no writer in this
      repository calls it, so the search computes the word of every candidate that carries none with the same
      parameters. The SAX bound skips candidates for zED only. The retrieval server offers it
      as POST /v1/episodes/similar.
  python:
    status: available
    class: "opentsx.client.retrieval.RetrievalClient#similar"
    note: >-
      similar(episode_id, series=[...], top_k=10) calls POST /v1/episodes/similar of the retrieval server and returns a
      DataFrame; Python computes nothing. python-package/tests/test_retrieval_client.py checks the request body and the
      frame against a stub server; the endpoint is tested in RetrievalServerTest.
  workbench: { status: none }
  processor: { status: none }
  go: { status: none }
docs: docs/user-manual/09-retrieval.md#93-pattern-search
literature:
  - "E. Keogh, K. Chakrabarti, M. Pazzani, S. Mehrotra, Dimensionality reduction for fast similarity search in large time series databases, Knowl. Inf. Syst. 3, 263 (2001)"
  - "J. Lin, E. Keogh, L. Wei, S. Lonardi, Experiencing SAX: a novel symbolic representation of time series, Data Min. Knowl. Discov. 15, 107 (2007)"
example:
  source: opentsx-retrieval/src/test/java/org/opentsx/retrieval/examples/SimilarEpisodesExampleTest.java
  chart: docs/user-manual/img/operators/pattern.similar-episodes.png
  shows: Of 30 noisy episodes of three shapes, the 9 nearest to the first ramp are the other 9 ramps, at distances of 2.6 or less, against 10.9 or more for every sine and gust.

# System document, schema opentsx.system.v1 (docs/datamodel-2026/schemas). Concept:
# docs/datamodel-2026/14-ENGINEERING-FLOW.md and 15-ENTSCHEIDUNGSKREIS.md. Read by the retrieval server (--systems)
# and checked in the build.
#
# The plan is the twin scenario h2-chain in its second form (compressor, high-pressure buffer, pipeline with two
# pressures, handover station; the order is an assumption, see the plan). Nine of its inputs come from outside, and
# each has a signal here; three of the signals are open. The wind farm stands on the data of the simulator scenario
# ostsee-demo in tsx.wind.episodes.v2, which is why its origin is SYNTHETIC. One turbine of six is written out; a
# template for all assets of a kind is not part of the format. opentsx-market has price sources; this document
# assumes none is connected, to show a simulated signal.
#
# The park has three powers (15, section 13.2). The potential is what the weather would give, before any
# restriction: an estimate from the wind speed and an input of the plan. The available power is what may be
# generated after the operating rules, and the generated power what runs after the dispatch: both are outputs the
# twin computes. The turbines measure what was generated; the sum of the measured power is an observation of that
# output and serves the comparison with the twin.
schema: opentsx.system.v1
system: h2-chain
version: 3
title: Wasserstoffkette am Windpark
example: true
domain: wind
plan: { ref: opentsx-twin/src/main/resources/twin/h2-chain.yaml }
inventory: { ref: opentsx-twin/src/main/resources/twin/inventar-beispiel.yaml, system: h2-chain }
catalogs:
  - { id: wind, ref: opentsx-windpark/src/main/resources/windpark/channel-catalog.yaml, version: 1.0.0 }

signals:
  # ---- sensor channels below the atom "park" (asset h2-chain/park/T02 of the inventory)
  - id: park/T02/WTUR.W
    title: Wirkleistung WEA T02
    role: observation
    meaning: Active power the turbine actually fed in; lower than the wind would give while the turbine is curtailed.
    channel: wind/WTUR.W
    expect: { operating: { min: 0, max: 3300 } }
    raw:
      source:
        kind: topic
        topic: tsx.wind.episodes.v2
        origin: SYNTHETIC
        select: { metric: wind.turbine.power_active, tags: { turbine: T02 } }
    clean:
      source: { kind: flow, flow: turbine-power-clean, output: clean }
    features:
      source: { kind: flow, flow: turbine-power-features }
      names: [lag_1, lag_10, mean_1h, std_1h]
  - id: park/T02/WMET.HorWdSpd
    title: Windgeschwindigkeit WEA T02
    role: exogenous
    meaning: Horizontal wind speed at hub height, measured on the nacelle behind the rotor.
    channel: wind/WMET.HorWdSpd
    expect: { operating: { min: 0, max: 25 } }
    raw:
      source:
        kind: topic
        topic: tsx.wind.episodes.v2
        origin: SYNTHETIC
        select: { metric: wind.met.wind_speed, tags: { turbine: T02 } }
    clean:
      source: { kind: flow, flow: wind-speed-clean, output: clean }
  - id: park/T02/WTUR.TurSt
    title: Betriebszustand WEA T02
    role: observation
    meaning: Operating state of the turbine; needed to tell a turbine that stands still from one that has no wind.
    channel: wind/WTUR.TurSt
    raw:
      source:
        kind: topic
        topic: tsx.wind.episodes.v2
        origin: SYNTHETIC
        select: { metric: wind.turbine.state, tags: { turbine: T02 } }

  # ---- ports of the plan (the id is the port)
  - id: park.p_gen_kw
    title: Tatsächliche Erzeugung des Windparks
    role: observation
    meaning: Power the park actually generated, after the operating rules and the dispatch. An output of the plan; the measurement is compared with what the twin computes.
    expect: { unit: kW, min: -600, max: 13000, interval: PT1M, kind: ANALOG, origin: MEASURED, operating: { min: 0, max: 12000 } }
    clean:
      source: { kind: flow, flow: park-power, output: sum }
  - id: park.p_potential_kw
    title: Windpotenzial des Parks
    role: estimate
    meaning: Power the park could generate with the weather there is, before any restriction or dispatch. Not measurable while the park is restricted; estimated from the wind speed.
    expect: { unit: kW, min: 0, max: 12000, interval: PT1M, kind: ANALOG, origin: ESTIMATED }
    clean:
      source: { kind: flow, flow: park-potential, output: potential }
  - id: park.dispatch_kw
    title: Fahrbefehl Windpark
    role: command
    meaning: Power the operator allows the park to generate, for example a curtailment at negative prices. Not a restriction from the operating rules.
    expect: { unit: kW, min: 0, max: 12000, interval: PT1M, kind: ANALOG, origin: REPORTED }
    raw:
      source: { kind: manual, value: 12000, origin: REPORTED }
  - id: market.price_eur_mwh
    title: Strompreis
    role: exogenous
    meaning: Day-ahead price of the quarter hour.
    expect: { unit: EUR/MWh, min: -500, max: 3000, interval: PT15M, kind: ANALOG, origin: REPORTED, operating: { min: 0, max: 250 } }
    raw:
      source:
        kind: generator
        processor: gen.ou
        seed: 7
        params: { mean: 62.8, reversion: 0.08, sigma: 9.0 }
    note: Kein Marktdaten-Topic angebunden. gen.ou ist ein Demo-Generator, kein Szenariomodell; Ergebnisse darauf taugen nicht für den Vergleich von Strategien.
  - id: offtake.demand_kgph
    title: Wasserstoffbedarf des Abnehmers
    role: exogenous
    meaning: Hydrogen the customer asks for at the handover station. Information, not a flow of gas.
    expect: { unit: kg/h, min: 0, max: 120, interval: PT1M, kind: ANALOG, origin: REPORTED }
    # open: no source
  - id: ely.setpoint_kw
    title: Sollwert Elektrolyseur
    role: command
    meaning: Electrical power the electrolyser is asked to draw.
    expect: { unit: kW, min: 0, max: 5000, interval: PT1M, kind: ANALOG, origin: REPORTED }
    raw:
      source: { kind: manual, value: 5000, origin: REPORTED }
  - id: battery.power_kw
    title: Fahrplan Batterie
    role: command
    meaning: Power the battery is asked to charge (negative) or discharge (positive).
    expect: { unit: kW, min: -1000, max: 1000, interval: PT1M, kind: ANALOG, origin: REPORTED }
    raw:
      source: { kind: manual, value: 0, origin: REPORTED }
  - id: handover.valve
    title: Regelventil der Übergabestation
    role: command
    meaning: Position of the regulating valve at the handover station, from 0 (closed) to 1 (open).
    expect: { unit: "1", min: 0, max: 1, interval: PT1M, kind: ANALOG, origin: REPORTED }
    raw:
      source: { kind: manual, value: 1, origin: REPORTED }
  - id: grid.p_grid_meas_kw
    title: Zähler am Netzanschlusspunkt
    role: observation
    meaning: Power the meter at the grid connection point measured, positive for feed-in. The physical delivery, as opposed to the schedule sold to the market.
    expect: { unit: kW, min: -6000, max: 12000, interval: PT1M, kind: ANALOG, origin: MEASURED }
    # open: no source
  - id: marketer.schedule_kw
    title: Fahrplan Direktvermarktung
    role: command
    meaning: Feed-in announced to the direct marketer for the quarter hour. The contract with the market, as opposed to what the meter at the grid connection point measures.
    expect: { unit: kW, min: 0, max: 12000, interval: PT15M, kind: ANALOG, origin: REPORTED }
    # open: no source

flows:
  - { id: turbine-power-clean, ref: systems/flows/turbine-power-clean.flow.yaml }
  - { id: turbine-power-features, ref: systems/flows/turbine-power-features.flow.yaml }
  - { id: wind-speed-clean, ref: systems/flows/wind-speed-clean.flow.yaml }
  - { id: park-power, ref: systems/flows/park-power.flow.yaml }
  - { id: park-potential, ref: systems/flows/park-potential.flow.yaml }
decisions:
  - { id: h2-dispatch, ref: systems/decisions/h2-dispatch.decision.yaml }

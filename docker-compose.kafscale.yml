services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - etcd-data:/etcd-data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  kafscale-broker:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    entrypoint: [/transport/kafscale-broker]
    volumes:
      - ./target/kafscale-proxy-linux:/transport:ro
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      KAFSCALE_BROKER_ID: "0"
      KAFSCALE_BROKER_ADDR: ":9092"
      KAFSCALE_BROKER_HOST: kafscale-broker
      KAFSCALE_BROKER_PORT: "9092"
      KAFSCALE_ETCD_ENDPOINTS: "http://etcd:2379"
      KAFSCALE_S3_BUCKET: "opentsx"
      KAFSCALE_S3_REGION: "us-east-1"
      KAFSCALE_S3_ENDPOINT: "http://minio:9000"
      KAFSCALE_S3_ACCESS_KEY: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      KAFSCALE_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
      KAFSCALE_S3_PATH_STYLE: "true"

  kafscale-proxy:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    entrypoint: [/transport/kafscale-proxy]
    read_only: true
    depends_on:
      etcd:
        condition: service_healthy
      kafscale-broker:
        condition: service_started
    environment:
      KAFSCALE_PROXY_ADDR: ":9092"
      KAFSCALE_PROXY_HEALTH_ADDR: "127.0.0.1:9080"
      KAFSCALE_PROXY_ADVERTISED_HOST: "${KAFSCALE_ADVERTISED_HOST:-localhost}"
      KAFSCALE_PROXY_ADVERTISED_PORT: "9092"
      KAFSCALE_PROXY_BACKENDS: kafscale-broker:9092
      KAFSCALE_PROXY_ETCD_ENDPOINTS: http://etcd:2379
    volumes:
      - ./target/kafscale-proxy-linux:/transport:ro
    ports:
      - "9092:9092"

volumes:
  etcd-data:
  minio-data:

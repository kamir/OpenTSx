# Example. No workflow publishes opentsx/time-series-generator: build it in opentsx-lg with
# mvn package -PSimpleTimeSeriesProducer,Docker (the tag is the Maven version) and load it into your cluster.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentsx-lg-demo
spec:
  selector:
    matchLabels:
      app: tsa-generator
  template:
    metadata:
      labels:
        app: tsa-generator
    spec:
      containers:
      - name: tsa-generator
        image: opentsx/time-series-generator:3.0.1
        env:
          - name: OPENTSX_TOPIC_MAP_FILE_NAME
            value: "/etc/opentsx/config/topiclist.def"
          - name: OPENTSX_PRIMARY_CLUSTER_CLIENT_CFG_FILE_NAME
            value: "/etc/opentsx/config/cuh.props"
          - name: OPENTSX_SHOW_GUI
            value: "false"
        ports:
        - containerPort: 8080
        volumeMounts:
        - mountPath: /etc/opentsx/config/
          name: configdir

      volumes:
      - name: configdir
        configMap:
          name: opentsx-lg-demo-config

---
apiVersion: v1
kind: Service
metadata:
  name: opentsx-lg-demo-service
spec:
  type: NodePort
  selector:
    app: tsa-generator
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080


# Logging of the backend (logging.config.fileConfig): one text line per event on stdout. app/main.py applies this
# file when it is imported and then sets the root level to LOG_LEVEL; the other loggers below keep their levels.

[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access,sqlalchemy,passlib_bcrypt

[handlers]
keys=stdout

[formatters]
keys=line

[logger_root]
level=INFO
handlers=stdout

[logger_uvicorn]
qualname=uvicorn
level=INFO
handlers=
propagate=1

[logger_uvicorn_error]
qualname=uvicorn.error
level=INFO
handlers=
propagate=1

[logger_uvicorn_access]
qualname=uvicorn.access
level=INFO
handlers=
propagate=1

[logger_sqlalchemy]
qualname=sqlalchemy
level=WARNING
handlers=
propagate=1

# passlib 1.7.4 reads bcrypt.__about__, which bcrypt 4 removed, and logs that trapped error with its stack trace at
# WARNING on the first hash
[logger_passlib_bcrypt]
qualname=passlib.handlers.bcrypt
level=ERROR
handlers=
propagate=1

[handler_stdout]
class=StreamHandler
formatter=line
args=(sys.stdout,)

[formatter_line]
format=%(asctime)s %(levelname)s %(name)s %(message)s
datefmt=%Y-%m-%dT%H:%M:%S%z

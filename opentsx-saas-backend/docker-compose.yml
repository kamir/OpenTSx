services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: opentsx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentsx}
      POSTGRES_USER: ${POSTGRES_USER:-opentsx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see DOCKER-SETUP.md}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - opentsx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentsx-backend
    restart: unless-stopped
    environment:
      # Application
      PROJECT_NAME: ${PROJECT_NAME:-OpenTSx SaaS Platform}
      API_V1_STR: ${API_V1_STR:-/api/v1}

      # Security
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, see DOCKER-SETUP.md}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Database - must match Settings field names
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-opentsx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see DOCKER-SETUP.md}
      POSTGRES_DB: ${POSTGRES_DB:-opentsx}
      POSTGRES_PORT: 5432

      # First Superuser
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@opentsx.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?set FIRST_SUPERUSER_PASSWORD, see DOCKER-SETUP.md}

      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - opentsx-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # Mount for development hot-reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ../opentsx-saas-frontend
      dockerfile: Dockerfile
    container_name: opentsx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ../opentsx-saas-frontend:/app
      - /app/node_modules
    networks:
      - opentsx-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  opentsx-network:
    driver: bridge
    name: opentsx-network

volumes:
  postgres_data:
    driver: local
    name: opentsx-postgres-data

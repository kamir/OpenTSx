version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: opentsx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentsx}
      POSTGRES_USER: ${POSTGRES_USER:-opentsx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - opentsx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentsx_user -d opentsx && PGPASSWORD=change_this_password psql -U opentsx_user -d opentsx -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: opentsx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_this_redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - opentsx-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentsx-backend
    restart: unless-stopped
    environment:
      # Application
      PROJECT_NAME: ${PROJECT_NAME:-OpenTSx SaaS Platform}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      DEBUG: ${DEBUG:-False}

      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opentsx_user}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-opentsx}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0

      # First Superuser
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@opentsx.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-admin123}

      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - opentsx-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # Mount for development hot-reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  opentsx-network:
    driver: bridge
    name: opentsx-network

volumes:
  postgres_data:
    driver: local
    name: opentsx-postgres-data
  redis_data:
    driver: local
    name: opentsx-redis-data

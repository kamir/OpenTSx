# nginx site of the static frontend image (deploy/docker/saas-frontend.Dockerfile).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Writing goes through the backend (/api/v1/dags/run), which checks the account. The retrieval server itself
    # has no accounts, so its write path is not reachable through this image.
    location /retrieval/v1/dags/ {
        default_type application/json;
        return 403 '{"error":"DAG runs go through /api/v1/dags/run"}';
    }

    # "Load episodes" in the workbench: the retrieval server sends no CORS headers, so the page reaches it
    # through this path. The Service opentsx-retrieval must exist, or nginx does not start.
    # Reading the retrieval server needs NO account: expose this image only on a trusted network.
    location /retrieval/ {
        proxy_pass http://opentsx-retrieval:8080/;
        proxy_read_timeout 60s;
    }

    # A DAG run may wait minutes for the broker (the retrieval server retries its writes).
    location /api/v1/dags/ {
        proxy_pass http://opentsx-saas-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SaaS backend (accounts, stored flows). The Service opentsx-saas-backend must exist, or nginx does not start.
    location /api/ {
        proxy_pass http://opentsx-saas-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Client-side routes (/workbench, /dashboard, ...)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Example flow, opentsx.flow.v1 (proposal): the clean power of the turbines becomes the available power of the
# park. It reads the topic of the clean series only. A processor "agg.sum" over several series does not exist yet;
# with one turbine written out in the example the sum is that turbine.
schema: opentsx.flow.v1
flow: park-power
reads: ["park/T02/WTUR.W@clean"]
nodes:
  - id: sum
    op: agg.sum
    in: [source]
    params: { every: PT1M }
writes:
  - { from: sum, signal: "park.p_avail_kw@clean" }

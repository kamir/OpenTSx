# opentsx.dag.v1, written by the OpenTSx web workbench
dag: wind-flow-23
version: 1
source:
  kind: kafscale-broker
  topics: [tsx.wind.episodes.v2]
  series: [abc123]
checkpoint: { backend: file }
nodes:
  - id: decode
    op: decode.avro-soe
  - id: n1
    op: dq.checks
    in: [decode]
    params: { checks: [PLAUSIBLE_RANGE], min: -100, max: 10000, mode: gap }
  - id: n2
    op: resample
    in: [n1]
    params: { every: PT60S, agg: MEAN }
sinks:
  - { from: n2, topic: tsx.wind.clean.v2, schema: opentsx.episode.v2 }

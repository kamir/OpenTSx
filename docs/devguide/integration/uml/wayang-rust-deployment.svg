lengthAdjust="spacing" textLength="269" x="934" y="793.0234">A topic is the smallest deployment unit.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="333" x="934" y="809.5117">Its partitions remain inside one assigned runner.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="384" x="934" y="826">Every cross-node edge needs an admitted data channel.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="302" x="934" y="842.4883">Raw records do not pass through the driver.</text></g><!--entity backend--><g id="elem_backend"><rect fill="#E8F0F8" height="62.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="274" x="270.5" y="301.4883"/><rect fill="#E8F0F8" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="524.5" y="306.4883"/><rect fill="#E8F0F8" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="522.5" y="308.4883"/><rect fill="#E8F0F8" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="522.5" y="312.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106" x="285.5" y="335.0234">SaaS admission</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234" x="285.5" y="351.5117">planned capability + policy checks</text></g><!--entity driver--><g id="elem_driver"><rect fill="#E8F0F8" height="62.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="302" x="285.5" y="418.4883"/><rect fill="#E8F0F8" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="567.5" y="423.4883"/><rect fill="#E8F0F8" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="565.5" y="425.4883"/><rect fill="#E8F0F8" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="565.5" y="429.4883"/><text fill="#000000" font-family="sans-serif" font-si
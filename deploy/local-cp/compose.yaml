services:
  workbench:
    image: ${OPENTSX_PYTHON_IMAGE:?run the build command first}
    platform: linux/arm64
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - serve
      - --bootstrap
      - ${KAFKA_BOOTSTRAP:?run the build command first}
      - --prefix
      - ${OPENTSX_TOPIC_PREFIX:?run the build command first}
      - --web-root
      - /artifacts/frontend
      - --manifest
      - /artifacts/manifest.json
      - --state-dir
      - /state
      - --registry-url
      - ${OPENTSX_REGISTRY_URL:?run the build command first}
    volumes:
      - ${OPENTSX_BUNDLE:?run the build command first}:/artifacts:ro
      - ${OPENTSX_BUNDLE:?run the build command first}/entrypoint.sh:/entrypoint.sh:ro
      - runtime:/runtime
      - state:/state
    ports:
      - "127.0.0.1:${OPENTSX_WORKBENCH_PORT:?run the build command first}:8080"
    networks: [cp]
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/analysis/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  registry:
    image: ${OPENTSX_REGISTRY_IMAGE:?run the build command first}
    platform: linux/arm64
    working_dir: /mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/registry.sqlite
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts
      - registry:5000,localhost:5000,127.0.0.1:5000
      - --workers
      - "1"
    volumes: [registry:/mlflow]
    networks: [cp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    mem_limit: 1g
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
networks:
  cp:
    external: true
    name: ${OPENTSX_CP_NETWORK:?run the build command first}
volumes:
  runtime:
  state:
  registry:

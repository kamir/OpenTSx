# Streaming statistics processor (org.opentsx.stats.StatsProcessorApp) on KafScale.
# Exactly ONE replica, strategy Recreate: the processor assigns all partitions manually (KafScale consumer groups
# are unreliable) and keeps positions + engine state in a checkpoint file. Two instances would double the output and
# fight over the checkpoint. It reads tsx.<domain>.episodes.v2 and writes tsx.<domain>.series-stats.v2.
# Partitions are discovered at start: if the topics did not exist yet, restart it after provisioning
# (40-demo.sh does this after windpark-sim / topics).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentsx-stats
  labels:
    app.kubernetes.io/name: opentsx-stats
    opentsx.org/kafka: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opentsx-stats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentsx-stats
        opentsx.org/kafka: "true"
    spec:
      terminationGracePeriodSeconds: 90   # the shutdown hook waits up to 60 s for the final checkpoint
      enableServiceLinks: false   # opentsx-retrieval would set OPENTSX_RETRIEVAL_PORT=tcp://..., which stats refuses
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: stats
          image: opentsx/tools
          imagePullPolicy: IfNotPresent
          args:
            - stats
            - --checkpoint
            - /state/stats.ckpt
          env:
            - name: KAFSCALE_BOOTSTRAP
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: KAFSCALE_BOOTSTRAP}}
            - name: OPENTSX_DOMAIN
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: OPENTSX_DOMAIN}}
            - name: OPENTSX_STATS_WINDOWS
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: OPENTSX_STATS_WINDOWS}}
            - name: OPENTSX_STATS_ALLOWED_LATENESS
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: OPENTSX_STATS_ALLOWED_LATENESS}}
          # <checkpoint>.progress: the time of the last poll the broker did not refuse, in seconds since the epoch,
          # written at most every 10 s. A broker that cannot be reached at all gives empty polls without a refusal:
          # with no records read since the last checkpoint the file stays fresh and these probes do not detect it;
          # otherwise the next checkpoint fails after the 3-minute delivery timeout and the processor exits 1; when it
          # wrote no statistics in the 5 minutes before, after up to 60 s per statistics record instead.
          # kafscale-check and the synthetic check detect an unreachable broker.
          startupProbe:     # up to 10 minutes for restoring the checkpoint and assigning the partitions
            exec: {command: [/bin/sh, -c, 'test $(( $(date +%s) - $(cat /state/stats.ckpt.progress) )) -lt 120']}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:   # a poll the broker did not refuse within the last 2 minutes
            exec: {command: [/bin/sh, -c, 'test $(( $(date +%s) - $(cat /state/stats.ckpt.progress) )) -lt 120']}
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:    # 10 minutes without a poll the broker did not refuse: stuck;
                            # 10 minutes of refusals stop the processor
            exec: {command: [/bin/sh, -c, 'test $(( $(date +%s) - $(cat /state/stats.ckpt.progress) )) -lt 600']}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: opentsx-stats-state

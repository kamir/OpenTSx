apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opentsx
spec:
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: opentsx-retrieval
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opentsx-studio
                port: {name: http}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opentsx-minio
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi        # see docs/devops/sizing-plan.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentsx-minio
  labels:
    app.kubernetes.io/name: opentsx-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opentsx-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentsx-minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: opentsx-secrets, key: S3_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: opentsx-secrets, key: S3_SECRET_KEY}}
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opentsx-minio
---
apiVersion: v1
kind: Service
metadata:
  name: opentsx-minio
spec:
  selector:
    app.kubernetes.io/name: opentsx-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
# Creates the warehouse bucket (idempotent). The MinIO image contains the mc client.
apiVersion: batch/v1
kind: Job
metadata:
  name: opentsx-minio-bucket
  labels:
    opentsx.org/setup: "true"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
          command: [/bin/sh, -c]
          args:
            - >-
              until mc alias set lake http://opentsx-minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 3; done &&
              mc mb --ignore-existing "lake/$S3_BUCKET" && mc ls lake
          env:
            - name: S3_BUCKET
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: S3_BUCKET}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: opentsx-secrets, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: opentsx-secrets, key: S3_SECRET_KEY}}
            - name: HOME
              value: /tmp
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}

# Lake profile for the demo Jobs: windpark-sim also writes the episodes to the Iceberg catalog.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Job
      name: opentsx-windpark-sim
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --sinks
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: kafscale,iceberg
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENTSX_ICEBERG_PROPERTIES
          valueFrom: {configMapKeyRef: {name: opentsx-config, key: ICEBERG_PROPS}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OPENTSX_ICEBERG_NAMESPACE
          valueFrom: {configMapKeyRef: {name: opentsx-config, key: OPENTSX_ICEBERG_NAMESPACE}}

# Vector processor (org.opentsx.retrieval.vector.VectorProcessorApp): keeps the vector Smart Topics of the domain up
# to date. It reads tsx.<domain>.episodes.v2, takes its DAGs from the control topic tsx.<domain>.dags.v1, writes
# tsx.<domain>.smart.<name>.vectors.v1 and reports to tsx.<domain>.dag-status.v1.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - vector-processor.yaml

# History archive (opentsx-market): a PVC and three CronJobs: daily forward archiving of the market series and of
# the DWD station observations, and the 6-hourly raw MOSMIX archive. Not part of the base; apply separately after 30-deploy.sh:
#   kubectl -n opentsx apply -k deploy/k3s/history
# Credentials (optional): write ENTSOE_TOKEN=<token>, NTP_CLIENT_ID=<id> and NTP_CLIENT_SECRET=<secret>, one per line,
# into a file of mode 600 outside the repository, then:
#   kubectl -n opentsx create secret generic opentsx-market --from-env-file=<file>
# --from-literal would put the values into the shell history and the process list.
# One-off backfill 2019..today (resumable, ~1 h at the default pause): kubectl -n opentsx apply -f backfill-job.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: opentsx
    includeTemplates: true
resources:
  - pvc.yaml
  - market-forward.yaml
  - weather-forward.yaml
  - mosmix-archive.yaml
images:
  - name: opentsx/tools
    newTag: 3.0.1-local

# Boat twin (Etap 22): synthetic trip + what-ifs. Real data: Secret opentsx-private, e.g. 40-demo.sh boat -- --data /private/bootsdaten.csv --calibrate
apiVersion: batch/v1
kind: Job
metadata:
  name: opentsx-boat
  labels:
    opentsx.org/demo: boat
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        opentsx.org/demo: boat
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: boat
          image: opentsx/tools
          imagePullPolicy: IfNotPresent
          args:
            - boat
          env:
            - name: OPENTSX_EXTRA_ARGS       # set by 40-demo.sh -- <args>
              value: ""
          resources:
            requests: {cpu: 250m, memory: 384Mi}   # measured peak RSS ~300-410 MB
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: private
              mountPath: /private
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: private
          secret:
            secretName: opentsx-private
            optional: true

# Runs the Studio export (all twin scenarios) inside the cluster and prints size and checksum of the JSON. The served page is built into the studio image from the same code.
apiVersion: batch/v1
kind: Job
metadata:
  name: opentsx-studio-export
  labels:
    opentsx.org/demo: studio-export
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        opentsx.org/demo: studio-export
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: studio-export
          image: opentsx/tools
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
          args:
            - -c
            - opentsx studio-export /tmp/studio.json && ls -l /tmp/studio.json && sha256sum /tmp/studio.json
          env:
            - name: OPENTSX_EXTRA_ARGS       # set by 40-demo.sh -- <args>
              value: ""
          resources:
            requests: {cpu: 250m, memory: 512Mi}   # measured peak RSS ~400-670 MB (all three scenarios)
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

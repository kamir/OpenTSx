# House twin: reference year + every lever as what-if. Private bills: Secret opentsx-private mounted at /private, e.g. 40-demo.sh house -- --calibrate /private/abrechnungen.csv
apiVersion: batch/v1
kind: Job
metadata:
  name: opentsx-house
  labels:
    opentsx.org/demo: house
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        opentsx.org/demo: house
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: house
          image: opentsx/tools
          imagePullPolicy: IfNotPresent
          args:
            - house
          env:
            - name: OPENTSX_EXTRA_ARGS       # set by 40-demo.sh -- <args>
              value: ""
          resources:
            requests: {cpu: 250m, memory: 512Mi}   # measured: needs > 384 MB heap with --calibrate; RSS ~670 MB at 512 MB heap
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: private
              mountPath: /private
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: private
          secret:
            secretName: opentsx-private
            optional: true

# DWD weather demo: MOSMIX forecast -> v2 series + CSV on the data PVC (/data/dwd), then the house twin over the
# forecast horizon. As shipped (40-demo.sh dwd) both commands read the MOSMIX fixture DWD_FIXTURE that ships in the
# image through OPENTSX_DWD_OFFLINE, so no internet is needed. 40-demo.sh dwd-online removes OPENTSX_DWD_OFFLINE and
# sets OPENTSX_DWD_STATION to the first station of DWD_STATIONS, which is then fetched from opendata.dwd.de.
apiVersion: batch/v1
kind: Job
metadata:
  name: opentsx-dwd
  labels:
    opentsx.org/demo: dwd
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        opentsx.org/demo: dwd
    spec:
      restartPolicy: Never
      enableServiceLinks: false   # opentsx-retrieval would set OPENTSX_RETRIEVAL_PORT=tcp://..., which the loader refuses
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: dwd
          image: opentsx/tools
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              mkdir -p /data/dwd
              opentsx dwd mosmix
              OPENTSX_EXTRA_ARGS= opentsx dwd house
              ls -l /data/dwd
          env:
            - name: OPENTSX_DWD_OFFLINE      # 40-demo.sh dwd-online removes it and sets OPENTSX_DWD_STATION
              valueFrom: {configMapKeyRef: {name: opentsx-config, key: DWD_FIXTURE}}
            - name: OPENTSX_DWD_OUT          # read by dwd mosmix only, like OPENTSX_DWD_DAILY
              value: /data/dwd/demo-mosmix.csv
            - name: OPENTSX_DWD_DAILY
              value: /data/dwd/demo-daily.csv
            - name: OPENTSX_EXTRA_ARGS       # set by 40-demo.sh -- <args> (appended to the mosmix command)
              value: ""
          resources:
            requests: {cpu: 100m, memory: 192Mi}   # measured peak RSS ~80 MB (fixture, house twin over 5 h)
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: opentsx-data

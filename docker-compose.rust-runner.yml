name: opentsx-rust-runner

x-runner: &runner
  image: rust:1.99.1-bookworm
  profiles: [workers]
  user: "${RUST_RUNNER_UID:?Set RUST_RUNNER_UID}:${RUST_RUNNER_GID:?Set RUST_RUNNER_GID}"
  entrypoint: [/runner/release/tsx-runner]
  restart: "no"
  read_only: true
  depends_on:
    kafscale-proxy:
      condition: service_started

services:
  kafscale-proxy:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    user: "${RUST_RUNNER_UID:?Set RUST_RUNNER_UID}:${RUST_RUNNER_GID:?Set RUST_RUNNER_GID}"
    entrypoint: [/transport/kafscale-cluster]
    command: [--listen, "0.0.0.0:${KAFSCALE_BROKER_PORT:-39092}", --advertised-host, kafscale-proxy, --advertised-port, "${KAFSCALE_BROKER_PORT:-39092}", --data-dir, /state, --broker-binary, /transport/kafscale-broker, --proxy-binary, /transport/kafscale-proxy]
    read_only: true
    volumes:
      - ./target/kafscale-proxy-linux:/transport:ro
      - ./target/rust-runner-compose/transport:/state
    ports:
      - "127.0.0.1:${KAFSCALE_BROKER_PORT:-39092}:${KAFSCALE_BROKER_PORT:-39092}"

  runner-build:
    image: rust:1.99.1-bookworm
    profiles: [build]
    working_dir: /workspace
    environment:
      CARGO_HOME: /cargo
    command:
      - cargo
      - build
      - --locked
      - --release
      - --manifest-path
      - rust/tsx-runner/Cargo.toml
      - --target-dir
      - /artifacts
    volumes:
      - .:/workspace:ro
      - ./target/rust-runner-linux:/artifacts
      - runner-cargo:/cargo

  runner-1:
    <<: *runner
    command: [replay, --request, /requests/worker-1.json, --checkpoint, /state/completed.json]
    volumes:
      - ./target/rust-runner-linux:/runner:ro
      - ./target/rust-runner-compose/requests:/requests:ro
      - ./target/rust-runner-compose/state/worker-1:/state

  runner-2:
    <<: *runner
    command: [replay, --request, /requests/worker-2.json, --checkpoint, /state/completed.json]
    volumes:
      - ./target/rust-runner-linux:/runner:ro
      - ./target/rust-runner-compose/requests:/requests:ro
      - ./target/rust-runner-compose/state/worker-2:/state

  runner-3:
    <<: *runner
    command: [replay, --request, /requests/worker-3.json, --checkpoint, /state/completed.json]
    volumes:
      - ./target/rust-runner-linux:/runner:ro
      - ./target/rust-runner-compose/requests:/requests:ro
      - ./target/rust-runner-compose/state/worker-3:/state

volumes:
  runner-cargo:

# Scenario S1 (H2 chain) for runs on archived history: the plan of opentsx-twin twin/h2-chain.yaml with a
# 15-minute base step (the market steps every superstep, MTU 15 min; hourly prices before 2025-10-01 are held).
# Start and number of steps are replaced per run (HistoryTwins); inputs come from the history archive:
#   market.price_eur_mwh   day-ahead DE-LU (REPORTED)
#   park.p_avail_kw        wind: national onshore generation scaled to the park, or a DWD station through a
#                          power curve (ESTIMATED)
#   marketer.schedule_kw   schedule from the day-ahead wind forecast minus the electrolyzer plan (FORECAST)
#   ely.setpoint_kw        price-limit dispatch rule (SYNTHETIC: a rule, not a real operator schedule)
#   offtake.demand_kgph    the buyer takes what the plan produces
twin: h2-chain-history
start: 2024-01-01T00:00:00Z
baseStep: PT15M
steps: 96
atoms:
  - id: rules
    type: operating-rules
  - id: market
    type: market
    params: { every: 1 }
  - id: offtake
    type: h2-offtake
  - id: park
    type: generation
    params: { ratedKw: 12000 }
  - id: ely
    type: electrolyzer
    params: { ratedKw: 5000, minLoad: 0.1, rampKwPerMin: 500, kwhPerKg: 55, pTripBar: 40, pResumeBar: 36, initialKw: 0 }
  - id: battery
    type: battery
    params: { capacityKwh: 2000, powerKw: 1000, soc0: 0.5 }
  - id: grid
    type: balance
    params: { priority: [self, ely, bat] }
  - id: line
    type: h2-line
    params: { volumeM3: 157, tempK: 288, p0Bar: 30, pMinBar: 20, pMaxBar: 40, warnMin: 60 }
  - id: marketer
    type: direct-marketer
    params: { toleranceKw: 500 }
wiring:
  - rules.limit_kw -> park.limit_kw
  - park.p_gen_kw -> grid.p_gen_kw
  - ely.p_el_kw -> grid.p_ely_kw
  - battery.p_bat_kw -> grid.p_bat_kw
  - ely.m_h2_kgph -> line.m_in_kgph
  - offtake.m_out_kgph -> line.m_out_kgph
  - offtake.m_out_kgph -> ely.m_offtake_kgph
  - line.p_bar -> ely.p_downstream_bar
  - line.headroom_kg -> ely.headroom_kg
  - grid.p_grid_kw -> marketer.p_grid_kw
  - market.price_eur_mwh -> marketer.price_eur_mwh

version: '3.8'

services:
  # --- Core Infrastructure ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: opentsx-onboarding-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - opentsx-onboarding

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: opentsx-onboarding-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - opentsx-onboarding

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: opentsx-onboarding-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - opentsx-onboarding

  # --- Storage Layer ---

  hbase:
    image: harisekhon/hbase:2.5
    container_name: opentsx-onboarding-hbase
    hostname: hbase
    ports:
      - "16000:16000"
      - "16010:16010"
    environment:
      HBASE_MANAGES_ZK: "true"
    volumes:
      - hbase_data:/hbase-data
    healthcheck:
      test: ["CMD-SHELL", "echo 'status' | hbase shell -n || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - opentsx-onboarding

  opentsdb:
    image: petergrace/opentsdb-docker:latest
    container_name: opentsx-onboarding-opentsdb
    depends_on:
      hbase:
        condition: service_healthy
    ports:
      - "4242:4242"
    environment:
      HBASE_ZOOKEEPER_QUORUM: hbase
      HBASE_ZOOKEEPER_PROPERTY_CLIENTPORT: 2181
      TSDB_TABLE: tsdb
      UID_TABLE: tsdb-uid
      TREE_TABLE: tsdb-tree
      META_TABLE: tsdb-meta
      AUTO_METRIC: "true"
    volumes:
      - opentsdb_data:/tmp/opentsdb
    networks:
      - opentsx-onboarding

  # --- Compute Layer (Flink) ---

  jobmanager:
    image: flink:1.18.0-scala_2.12-java11
    container_name: opentsx-onboarding-flink-jobmanager
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - opentsx-onboarding

  taskmanager:
    image: flink:1.18.0-scala_2.12-java11
    container_name: opentsx-onboarding-flink-taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - opentsx-onboarding

  # --- Interactive Layer (Jupyter) ---

  jupyter:
    image: jupyter/all-spark-notebook:spark-3.5.0
    container_name: opentsx-onboarding-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=opentsx
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - opentsx-onboarding

volumes:
  hbase_data:
  opentsdb_data:

networks:
  opentsx-onboarding:
    name: opentsx-onboarding

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator-learning:
    name: Operator learning synchronization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test repository metadata and learning synchronization
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Generate and check the student material
        run: |
          mkdir -p "$RUNNER_TEMP/student-course"
          python3 tools/sync_operator_exercises.py --opentsx-root . --student-root "$RUNNER_TEMP/student-course"
          python3 tools/sync_operator_exercises.py --opentsx-root . --student-root "$RUNNER_TEMP/student-course" --check

  execution-contracts:
    name: Shared contract vectors and Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check generated contract vectors
        run: python3 tools/execution_contract_vectors.py --check
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting of the shared contract crate
        run: cargo +1.99.1 fmt --manifest-path rust/tsx-contracts/Cargo.toml -- --check
      - name: Check the shared contract crate with Clippy
        run: cargo +1.99.1 clippy --locked --manifest-path rust/tsx-contracts/Cargo.toml --all-targets -- -D warnings
      - name: Run the Rust consumer of the shared cases
        run: cargo +1.99.1 test --locked --manifest-path rust/tsx-contracts/Cargo.toml -- --nocapture

  rust-runner:
    name: Rust runner tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned formatting and lint components
        run: rustup component add --toolchain 1.99.1 rustfmt clippy
      - name: Check formatting of the runner crate
        run: cargo +1.99.1 fmt --manifest-path rust/tsx-runner/Cargo.toml -- --check
      - name: Check all runner targets with Clippy
        run: cargo +1.99.1 clippy --locked --manifest-path rust/tsx-runner/Cargo.toml --all-targets -- -D warnings
      - name: Run locked runner tests
        run: cargo +1.99.1 test --locked --all-targets --manifest-path rust/tsx-runner/Cargo.toml -- --nocapture

  rust-runner-native:
    name: Rust native ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Execute native shared vectors and runner regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rust-native
          cargo +1.99.1 test --locked --manifest-path rust/tsx-contracts/Cargo.toml -- --nocapture 2>&1 | tee target/rust-native/contracts.log
          cargo +1.99.1 test --locked --all-targets --manifest-path rust/tsx-runner/Cargo.toml -- --nocapture 2>&1 | tee target/rust-native/runner.log
          python3 tools/rust_runner_artifacts.py tests --mode native --target ${{ matrix.target }} --log target/rust-native/contracts.log --log target/rust-native/runner.log --report target/rust-native/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-native-${{ matrix.target }}
          path: target/rust-native/
          if-no-files-found: error
          retention-days: 7

  rust-runner-static:
    name: Rust static ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTFLAGS: "-C relocation-model=static -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the pinned Rust target and cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 ${{ matrix.target }}
          mkdir -p "$RUNNER_TEMP/rust-target-tools"
          for tool in cc cxx ar ranlib; do
            printf '#!/bin/sh\nexec python3 "%s" compiler "%s" "$@"\n' "$GITHUB_WORKSPACE/tools/rust_runner_artifacts.py" "$tool" > "$RUNNER_TEMP/rust-target-tools/$tool"
            chmod +x "$RUNNER_TEMP/rust-target-tools/$tool"
          done
          printf 'CC=%s/rust-target-tools/cc\nCXX=%s/rust-target-tools/cxx\nAR=%s/rust-target-tools/ar\nRANLIB=%s/rust-target-tools/ranlib\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          printf '%s  %s\n' '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239' "$RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zig" "$RUNNER_TEMP/cargo-zigbuild"
          tar xf "$RUNNER_TEMP/zig.tar.xz" --strip-components 1 -C "$RUNNER_TEMP/zig"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output "$RUNNER_TEMP/cargo-zigbuild.tar.xz" https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz
          printf '%s  %s\n' '9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b' "$RUNNER_TEMP/cargo-zigbuild.tar.xz" | sha256sum --check
          tar xf "$RUNNER_TEMP/cargo-zigbuild.tar.xz" --strip-components 1 -C "$RUNNER_TEMP/cargo-zigbuild"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cargo-zigbuild" >> "$GITHUB_PATH"
      - name: Install the pinned user-mode emulator
        if: matrix.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --output "$RUNNER_TEMP/qemu-user.deb" https://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/qemu-user_8.2.2+ds-0ubuntu1.18_amd64.deb
          printf '%s  %s\n' '9655f3e7e50af597e1b845822c47af9231f9f1bcb8c99e586db9da775d70c041' "$RUNNER_TEMP/qemu-user.deb" | sha256sum --check
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "$RUNNER_TEMP/qemu-user.deb"
      - name: Build and inspect the static executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rust-static-evidence
          cargo-zigbuild build --locked --release --target ${{ matrix.target }} --manifest-path rust/tsx-runner/Cargo.toml --target-dir target/rust-static 2>&1 | tee target/rust-static-evidence/build.log
          python3 tools/rust_runner_artifacts.py inspect --binary target/rust-static/${{ matrix.target }}/release/tsx-runner --target ${{ matrix.target }} --report target/rust-static-evidence/artifact.json
      - name: Retain bounded failed cross-build compiler and object diagnostics
        if: failure()
        run: python3 tools/rust_runner_artifacts.py diagnostics --directory target/rust-static --target ${{ matrix.target }} --report target/rust-static-evidence/diagnostics.json
      - name: Execute supplementary ARMv7 emulated shared vectors and regressions
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        shell: bash
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm
        run: |
          set -euo pipefail
          cargo-zigbuild test --locked --release --target ${{ matrix.target }} --manifest-path rust/tsx-contracts/Cargo.toml --target-dir target/rust-static -- --nocapture 2>&1 | tee target/rust-static-evidence/contracts-emulated.log
          cargo-zigbuild test --locked --release --all-targets --target ${{ matrix.target }} --manifest-path rust/tsx-runner/Cargo.toml --target-dir target/rust-static -- --nocapture 2>&1 | tee target/rust-static-evidence/runner-emulated.log
          python3 tools/rust_runner_artifacts.py tests --mode emulated --target ${{ matrix.target }} --log target/rust-static-evidence/contracts-emulated.log --log target/rust-static-evidence/runner-emulated.log --report target/rust-static-evidence/tests-emulated.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-static-${{ matrix.target }}
          path: |
            target/rust-static/${{ matrix.target }}/release/tsx-runner
            target/rust-static-evidence/
          if-no-files-found: error
          retention-days: 7

  rust-b1-acceptance:
    name: Rust B1 Proxy acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KAFSCALE_REF: v1.6.0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Maven 3.9.8
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
          printf '%s  %s\n' '7d171def9b85846bf757a2cec94b7529371068a0670df14682447224e57983528e97a6d1b850327e4ca02b139abaab7fcb93c4315119e6f0ffb3f0cbc0d0b9a2' "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" | sha512sum --check
          tar xzf "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.8/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/checkout@v7
        with:
          repository: KafScale/platform
          ref: ${{ env.KAFSCALE_REF }}
          path: kafscale
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.2"
          cache-dependency-path: kafscale/go.sum
      - name: Build pinned KafScale broker and Proxy fixtures
        working-directory: kafscale
        run: |
          test "$(git rev-parse HEAD)" = 2809a3a20bf40ed8a2b82cd93215cb59396efb0a
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python3 -c 'import os; from pathlib import Path; import build_kafscale_proxy; build_kafscale_proxy.transport_overlay(Path.cwd(), Path(os.environ["RUNNER_TEMP"]))'
          CGO_ENABLED=0 go test -overlay="$RUNNER_TEMP/broker-overlay.json" ./cmd/proxy ./pkg/metadata -run '^TestOpenTSx(Proxy|Metadata)' -count=1 -v
          CGO_ENABLED=0 go test -run '^TestOpenTSxCluster' -count=1 -v "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster.go" "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster_test.go"
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-broker" ./cmd/broker
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-proxy" ./cmd/proxy
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-cluster" "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster.go"
      - name: Compile the Java reference and Rust production probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          mvn -B -ntp -pl opentsx-wayang -am -DskipTests install 2>&1 | tee target/rust-b1-java.log
          bin/opentsx classpath opentsx-wayang > "$RUNNER_TEMP/rust-b1-classpath.log"
          cargo +1.99.1 build --locked --release --examples --bins --manifest-path rust/tsx-runner/Cargo.toml --target-dir target/rust-b1 2>&1 | tee target/rust-b1-build.log
      - name: Start isolated KafScale Proxy with private broker and metadata
        shell: bash
        run: |
          set -euo pipefail
          nohup "$RUNNER_TEMP/kafscale-cluster" --listen 127.0.0.1:39092 \
            --advertised-host 127.0.0.1 --advertised-port 39092 --data-dir "$RUNNER_TEMP/kafscale-metadata" \
            --broker-binary "$RUNNER_TEMP/kafscale-broker" --proxy-binary "$RUNNER_TEMP/kafscale-proxy" \
            > "$RUNNER_TEMP/kafscale-broker.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/rust-b1-cluster.pid"
          for _ in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/39092) 2>/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/kafscale-broker.log"; exit 1
      - name: Verify protocol families, producer placement and signed-run recovery against the Proxy
        env:
          KAFSCALE_BOOTSTRAP: 127.0.0.1:39092
        run: |
          python3 tools/rust_b1_acceptance.py \
            --runner target/rust-b1/release/tsx-runner \
            --conformance-binary target/rust-b1/release/examples/b1_acceptance \
            --placement-binary target/rust-b1/release/examples/b1_placement \
            --run-binary target/rust-b1/release/examples/b1_run_acceptance \
            --output target/rust-b1-evidence
      - name: Stop the owned disposable Proxy cluster
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/rust-b1-cluster.pid" ]]; then
            cluster_pid=$(cat "$RUNNER_TEMP/rust-b1-cluster.pid")
            [[ "$cluster_pid" =~ ^[1-9][0-9]*$ ]]
            if kill -0 "$cluster_pid" 2>/dev/null; then kill "$cluster_pid"; fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-b1-proxy-acceptance
          path: |
            target/rust-b1-evidence/report.json
            target/rust-b1-evidence/**/stdout.log
            target/rust-b1-evidence/**/stderr.log
            target/rust-b1-evidence/**/result.json
            target/rust-b1-evidence/run/rust-run-report.json
            target/rust-b1-evidence/run/**/*.stdout
            target/rust-b1-evidence/run/**/*.stderr
            target/rust-b1-evidence/run/verified-*.json
            target/rust-b1-java.log
            target/rust-b1-build.log
            ${{ runner.temp }}/kafscale-broker.log
          if-no-files-found: error
          retention-days: 7

  rust-runner-compose:
    name: Rust runner three-worker Compose acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAFSCALE_BROKER_PORT: "39093"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Maven 3.9.8
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
          printf '%s  %s\n' '7d171def9b85846bf757a2cec94b7529371068a0670df14682447224e57983528e97a6d1b850327e4ca02b139abaab7fcb93c4315119e6f0ffb3f0cbc0d0b9a2' "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" | sha512sum --check
          tar xzf "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.8/bin" >> "$GITHUB_PATH"
      - name: Check helper syntax and CLI
        run: |
          python3 -m py_compile tools/verify_rust_runner_compose.py
          python3 tools/verify_rust_runner_compose.py --help
      - name: Verify three whole-topic workers and replay against Java
        run: python3 tools/verify_rust_runner_compose.py
      - name: Require all three acceptance phases
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          directory = Path("target/rust-runner-compose")
          fixture = json.loads((directory / "expected.json").read_text())
          expected = {worker["worker"]: len(worker["expected"]) for worker in fixture["workers"]}
          assert set(expected) == {1, 2, 3}
          for phase, multiplier in [("initial", 1), ("completed-retry", 1), ("checkpoint-replay", 2)]:
              report = json.loads((directory / f"verify-{phase}.json").read_text())
              workers = {worker["worker"]: worker for worker in report["workers"]}
              assert report["phase"] == phase and len(report["workers"]) == 3 and set(workers) == set(expected)
              for worker, count in expected.items():
                  assert workers[worker]["partitions"] == worker
                  assert workers[worker]["distinctEpisodes"] == count
                  assert workers[worker]["records"] == count * multiplier
              assert report["records"] == sum(expected.values()) * multiplier
              assert report["distinctEpisodes"] == sum(expected.values())
          print("All three whole-topic worker acceptance phases executed successfully")
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-runner-compose
          path: |
            target/rust-runner-compose/
            target/rust-runner-linux/release/tsx-runner

  wayang-rust-compose:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: bounded
            name: UI Wayang Rust three-worker acceptance
            artifact: wayang-rust-browser-parity
          - profile: continuous
            name: Continuous UI Wayang Rust three-worker acceptance
            artifact: wayang-rust-continuous-browser-parity
          - profile: fencing
            name: Fenced UI Wayang Rust three-worker acceptance
            artifact: wayang-rust-fencing-browser-parity
    env:
      KAFSCALE_BROKER_PORT: "39093"
      WAYANG_UI_PORT: "18081"
      WAYANG_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: opentsx-saas-frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Maven 3.9.8
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
          printf '%s  %s\n' '7d171def9b85846bf757a2cec94b7529371068a0670df14682447224e57983528e97a6d1b850327e4ca02b139abaab7fcb93c4315119e6f0ffb3f0cbc0d0b9a2' "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" | sha512sum --check
          tar xzf "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.8/bin" >> "$GITHUB_PATH"
      - name: Install the pinned browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/wayang-browser" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/wayang-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check helper guards and syntax
        run: |
          python3 -m unittest discover -s tools -p test_verify_wayang_rust_compose.py -v
          python3 -m py_compile tools/verify_wayang_rust_compose.py
          python3 tools/verify_wayang_rust_compose.py --help
          node --check tools/wayang_rust_browser.mjs
      - name: Verify the real UI through Wayang and three Rust workers
        run: python3 tools/verify_wayang_rust_compose.py --profile "$WAYANG_PROFILE" --playwright-module "$RUNNER_TEMP/wayang-browser/node_modules/playwright"
      - name: Require browser, Java parity and restart evidence
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          root = Path("target/wayang-rust-compose")
          result = json.loads((root / "result.json").read_text())
          assert result["workers"] == 3
          if os.environ["WAYANG_PROFILE"] == "fencing":
              import sys
              sys.path.insert(0, "tools")
              from verify_wayang_rust_compose import verify_fencing_views
              assert result == verify_fencing_views()
              assert result["staleWorkerDenied"] and result["outputOffsetsUnchanged"]
              assert result["oldGrantHttpStatus"] == result["forgedEpochHttpStatus"] == 403
              for phase in result["phases"]:
                  assert (root / f"browser-{phase}.png").is_file()
              print("Actual UI replacement, Java parity, restored old worker and Proxy denials were verified")
              raise SystemExit(0)
          continuous = os.environ["WAYANG_PROFILE"] == "continuous"
          phases = ["initial", "retry", "new-data", "restart", "after-restart", "worker-unavailable", "worker-restart", "after-worker-restart", "stopped"] if continuous else ["initial", "retry", "restart"]
          assert result["phases"] == phases
          assert result["verifiedRecords"] == result["distinctEpisodes"] == (42 if continuous else 12)
          if continuous:
              assert result["inputRecords"] == "42"
              outage = json.loads((root / "worker-outage.json").read_text())
              assert outage["worker"] == "worker-2" and outage["throughBlocks"] == 6
              assert outage["liveServices"] == ["backend", "coordinator", "etcd", "frontend", "kafscale-broker", "kafscale-read", "kafscale-write", "postgres", "runner-1", "runner-3", "wayang"]
          for phase in result["phases"]:
              browser = json.loads((root / f"browser-{phase}.json").read_text())
              parity = json.loads((root / f"verified-{phase}.json").read_text())
              assert browser["assignments"] == 3
              assert browser["state"] == (("stopped" if phase == "stopped" else "idle") if continuous else "completed")
              if continuous:
                  assert browser["submissions"] == int(phase in ("initial", "retry"))
                  assert parity["verifiedRecords"] == parity["distinctEpisodes"] == int(browser["blocks"]) * 6
              else:
                  assert parity["verifiedRecords"] == parity["distinctEpisodes"] == 12
              assert (root / f"browser-{phase}.png").is_file()
              assert (root / f"deployment-{phase}.json").is_file()
          print("Actual UI submission, Java parity, input progress and service restart were verified")
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/wayang-rust-compose/result.json
            target/wayang-rust-compose/fixture.json
            target/wayang-rust-compose/submitted-dag.txt
            target/wayang-rust-compose/submitted-dag-replacement.txt
            target/wayang-rust-compose/fencing-*.json
            target/wayang-rust-compose/fencing-*.log
            target/wayang-rust-compose/worker-*.log
            target/wayang-rust-compose/browser-*.json
            target/wayang-rust-compose/browser-*.png
            target/wayang-rust-compose/deployment-*.json
            target/wayang-rust-compose/verified-*.json
            target/wayang-rust-compose/worker-outage*.json
            target/wayang-rust-compose/worker-outage*.log
            target/wayang-rust-compose/browser-*.log
            target/wayang-rust-compose/parity-*.log
            target/wayang-rust-compose/runtime.log

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: xvfb-run --auto-servernum mvn -B -ntp verify
      - name: Check shared aggregate transport bytes
        run: python3 tools/aggregate_transport_vectors.py --check

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python-package/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[forecasting,kafka]" pytest
      - name: Test
        run: python -m pytest -q
      - name: Local CP launcher tests
        if: matrix.python == '3.12'
        working-directory: .
        run: python -m unittest discover -s deploy/local-cp -p test_workbench.py -v
      - name: Documentation links
        if: matrix.python == '3.12'
        working-directory: .
        run: python tools/check_links.py

  saas-frontend:
    name: SaaS frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentsx-saas-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: opentsx-saas-frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Types and lint
        run: npx tsc --noEmit && npm run lint
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build

  saas-backend:
    name: SaaS backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentsx-saas-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: opentsx-saas-backend/requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q tests

  deploy:
    name: k3s scripts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and shellcheck
        run: |
          for f in deploy/k3s/*.sh deploy/docker/*.sh; do bash -n "$f"; done
          command -v shellcheck || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck -x -P SCRIPTDIR deploy/k3s/*.sh deploy/docker/*.sh
      - name: Render the kustomize overlays (default, hostnetwork, service, lake, modbus-sim, dwd-forward, monitoring, saas, retrieval-kafscale, event-bridge) and the history archive
        run: |
          kubectl version --client
          mkdir -p "$RUNNER_TEMP/rendered"
          i=0
          for cfg in "KAFSCALE_BOOTSTRAP=10.0.0.5:9092" \
                     "KAFSCALE_BOOTSTRAP=localhost:9092 KAFSCALE_NETWORK=hostnetwork MODBUS_SIM=true DWD_FORWARD=true MONITORING=true" \
                     "KAFSCALE_BOOTSTRAP=10.0.0.5:9092 KAFSCALE_NETWORK=service SAAS=true RETRIEVAL_SOURCE=kafscale RETRIEVAL_DAG_RUNS=true VECTOR_PROCESSOR=true" \
                     "KAFSCALE_BOOTSTRAP=10.0.0.5:9092 LAKE=true INGRESS=true MODBUS_SIM=true DWD_FORWARD=true MONITORING=true SAAS=true EVENT_BRIDGE=true STORAGE_CLASS=local-path"; do
            rm -f deploy/k3s/.env
            deploy/k3s/20-configure.sh $cfg
            i=$((i + 1))
            kubectl kustomize deploy/k3s/overlays/local > "$RUNNER_TEMP/rendered/overlay-$i.yaml"
            kubectl kustomize deploy/k3s/overlays/local/jobs > "$RUNNER_TEMP/rendered/jobs-$i.yaml"
          done
          # history archive (opentsx-market): PVC + CronJobs as a kustomization, the one-off backfill Jobs as plain files
          kubectl kustomize deploy/k3s/history > "$RUNNER_TEMP/rendered/history.yaml"
          cp deploy/k3s/history/*-job.yaml "$RUNNER_TEMP/rendered/"
      - name: Validate the rendered manifests (kubeconform, Kubernetes 1.31 schemas)
        run: |
          # retried: a single 5xx from the release download must not fail the check
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.31.0 "$RUNNER_TEMP"/rendered/*.yaml
      - name: Probe plan (60-probe.sh --dry-run, with and without --local-kafscale)
        run: |
          rm -f deploy/k3s/.env
          deploy/k3s/20-configure.sh KAFSCALE_BOOTSTRAP=10.0.0.5:9092
          deploy/k3s/60-probe.sh --dry-run --skip-build --report "$RUNNER_TEMP/probe-plan.md"
          deploy/k3s/60-probe.sh --dry-run --local-kafscale --kafscale-host 10.1.2.3 --report "$RUNNER_TEMP/probe-plan-local.md"
          cat "$RUNNER_TEMP/probe-plan-local.md" >> "$GITHUB_STEP_SUMMARY"

  kafscale-conformance:
    name: KafScale conformance
    runs-on: ubuntu-latest
    env:
      KAFSCALE_REF: v1.6.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the pinned Rust B2 parity harness
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --examples --bins --manifest-path rust/tsx-runner/Cargo.toml --target-dir target/rust-b2
      - uses: actions/checkout@v7
        with:
          repository: KafScale/platform
          ref: ${{ env.KAFSCALE_REF }}
          path: kafscale
      - uses: actions/setup-go@v7
        with:
          go-version-file: kafscale/go.mod
          cache-dependency-path: kafscale/go.sum
      - name: Build pinned KafScale broker and Proxy fixtures
        working-directory: kafscale
        run: |
          test "$(git rev-parse HEAD)" = 2809a3a20bf40ed8a2b82cd93215cb59396efb0a
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python3 -c 'import os; from pathlib import Path; import build_kafscale_proxy; build_kafscale_proxy.transport_overlay(Path.cwd(), Path(os.environ["RUNNER_TEMP"]))'
          CGO_ENABLED=0 go test -overlay="$RUNNER_TEMP/broker-overlay.json" ./cmd/proxy ./pkg/metadata -run '^TestOpenTSx(Proxy|Metadata)' -count=1 -v
          CGO_ENABLED=0 go test -run '^TestOpenTSxCluster' -count=1 -v "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster.go" "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster_test.go"
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-broker" ./cmd/broker
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-proxy" ./cmd/proxy
          CGO_ENABLED=0 go build -overlay="$RUNNER_TEMP/broker-overlay.json" -trimpath -buildvcs=false -ldflags=-buildid= -o "$RUNNER_TEMP/kafscale-cluster" "$GITHUB_WORKSPACE/tools/kafscale_proxy_cluster.go"
      - name: Start isolated KafScale Proxy with private broker and metadata
        run: |
          nohup "$RUNNER_TEMP/kafscale-cluster" --listen 127.0.0.1:39092 \
            --advertised-host 127.0.0.1 --advertised-port 39092 --data-dir "$RUNNER_TEMP/kafscale-metadata" \
            --broker-binary "$RUNNER_TEMP/kafscale-broker" --proxy-binary "$RUNNER_TEMP/kafscale-proxy" \
            > "$RUNNER_TEMP/kafscale-broker.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/39092) 2>/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/kafscale-broker.log"; exit 1
      - name: Run conformance suite, episode-log, wire round-trip, wind-farm, statistics, event-topic and streaming integration tests
        env:
          KAFSCALE_BOOTSTRAP: 127.0.0.1:39092
          KAFSCALE_BROKER_BINARY: ${{ runner.temp }}/kafscale-broker
          KAFSCALE_PROXY_BINARY: ${{ runner.temp }}/kafscale-proxy
          KAFSCALE_CLUSTER_BINARY: ${{ runner.temp }}/kafscale-cluster
        # opentsx-legacy-bridge pulls in opentsx-core, whose Swing tests need a display
        run: xvfb-run --auto-servernum mvn -B -ntp -Dopentsx.rust.b2.parity="$GITHUB_WORKSPACE/target/rust-b2/debug/examples/b2_parity" -pl opentsx-kafscale-conformance,opentsx-kafka-v2,opentsx-legacy-bridge,opentsx-windpark,opentsx-stats,opentsx-twin-live,opentsx-retrieval,opentsx-wayang -am test
      - name: Require executed streaming acceptance
        if: always()
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          path = "opentsx-retrieval/target/surefire-reports/TEST-org.opentsx.retrieval.server.KafkaStreamingIntegrationTest.xml"
          suite = ET.parse(path).getroot()
          expected = {
              "httpDeploymentFollowsNewInputAndStopsItsVector",
              "refusesPartialDeploymentBeforeWritingControlRecords",
              "cleaningResumesAnOpenWindowFromItsCheckpoint",
          }
          executed = {case.attrib["name"].split("(", 1)[0] for case in suite.findall("testcase") if case.find("skipped") is None}
          if not expected.issubset(executed) or any(int(suite.attrib[key]) for key in ("failures", "errors", "skipped")):
              raise SystemExit("streaming acceptance is missing, skipped or failed")
          print("All three streaming acceptance cases executed successfully")
          PYTHON
      - name: Require executed Wayang acceptance (TASK-020 A1 to A4)
        if: always()
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          expected = {
              "TsxPassThroughIntegrationTest": 1,
              "TsxCrashRecoveryIntegrationTest": 1,
              "TsxFingerprintIntegrationTest": 1,
              "TsxCleanIncrementsIntegrationTest": 1,
              "TsxCleanParityIntegrationTest": 1,
              "TrackParityIntegrationTest": 1,
              "TsxStatusIntegrationTest": 2,
              "TsxCleanVectorsTest": 3,
              "TsxStatsVectorsTest": 12,
              "DagToWayangErrorsTest": 35,
              "DagToWayangWorkbenchTest": 6,
              "DagToWayangCatalogTest": 28,
              "TsxPairWithinTest": 1,
              "TsxStrictCutTest": 7,
              "TsxSitePlatformTest": 2,
              "SiteConformanceChecksTest": 3,
              "SiteLifecycleIntegrationTest": 2,
              "LatencyProtocolObserverTest": 2,
              "MergeOrderTest": 8,
              "W3StatsMergeTest": 2,
              "ConformanceHandshakeTest": 3,
              "FederatedStatsIntegrationTest": 1,
              "CompletenessIntegrationTest": 1,
              "JobStateRouteIntegrationTest": 1,
              "federation.AggregateRecordTest": 5,
              "federation.CompletenessCoordinatorTest": 6,
              "federation.AggregateForwarderTest": 5,
              "federation.SiteStatsTest": 2,
              "federation.AggregateTransportVectorsTest": 13,
              "site.TsxSiteAgentPlanTest": 14,
              "site.ConformanceHandshakeTest": 13,
              "site.SiteStatusTest": 5,
              "TsxVectorVectorsTest": 13,
              "TsxVectorIntegrationTest": 1,
              "TsxPairVectorsTest": 12,
              "TsxPairEsWayangTest": 11,
              "TsxSegmentVectorsTest": 13,
              "TsxSaxVectorsTest": 8,
              "TsxDqVectorsTest": 10,
              "TsxStreamEqualsBatchTest": 65,
              "TsxCatalogBindingsTest": 2,
              "TsxSignalSinkIntegrationTest": 2,
          }
          for name, minimum in expected.items():
              suite = ET.parse(f"opentsx-wayang/target/surefire-reports/TEST-org.opentsx.wayang.{name}.xml").getroot()
              if int(suite.attrib["tests"]) < minimum or any(int(suite.attrib[k]) for k in ("failures", "errors", "skipped")):
                  raise SystemExit(f"{name} is missing, skipped or failed")
              executed = {case.attrib["name"].split("(", 1)[0] for case in suite.findall("testcase")}
              if name == "DagToWayangErrorsTest" and not {
                  "message13RejectsAMissingRequiredParameter",
                  "message14RejectsTheWrongParameterType",
                  "message15RejectsAParameterOutsideItsCatalogBounds",
                  "message16RejectsAnUnknownEnumValue",
              }.issubset(executed):
                  raise SystemExit("one of the four exact parameter messages was not tested")
              if name == "TsxStatsVectorsTest":
                  vectors = [case for case in suite.findall("testcase")
                             if case.attrib["name"].startswith("everySharedCaseMatchesThroughAWayangPlan()[")]
                  if len(vectors) != 5:
                      raise SystemExit("all five statistics vectors must execute through Wayang")
              if name == "TsxVectorVectorsTest":
                  vectors = [case for case in suite.findall("testcase")
                             if case.attrib["name"].startswith("everySharedCaseMatchesThroughAWayangPlan()[")]
                  if len(vectors) != 6:
                      raise SystemExit("all six align.vector vectors must execute through Wayang")
              if name == "TsxPairVectorsTest":
                  vectors = [case for case in suite.findall("testcase")
                             if case.attrib["name"].startswith("everySharedCaseMatchesThroughAWayangPlan()[")]
                  if len(vectors) != 5:
                      raise SystemExit("all five pair.xcorr vectors must execute through Wayang")
              factories = {
                  "DagToWayangErrorsTest": ("allNormativeRejections()[", 22),
                  "DagToWayangCatalogTest": ("allSixteenCatalogBindingsExecuteThroughCompiledWayangPlans()[", 16),
                  "TsxPairEsWayangTest": ("everySeriesCaseMatchesThroughAWayangPlan()[", 4),
                  "TsxSegmentVectorsTest": ("sharedVectorsThroughRealWayangPlans()[", 12),
                  "TsxSaxVectorsTest": ("allSharedWordsMatchThroughWayang()[", 7),
                  "TsxDqVectorsTest": ("allSharedResultsMatchThroughWayang()[", 7),
                  "TsxStreamEqualsBatchTest": ("everyVectorCaseMatchesInSixChunkAndSeriesOrders()[", 65),
              }
              if name in factories:
                  prefix, count = factories[name]
                  if sum(case.attrib["name"].startswith(prefix) for case in suite.findall("testcase")) != count:
                      raise SystemExit(f"{name} did not execute every shared case")
          print(f"All {len(expected)} Wayang acceptance classes executed successfully")
          suite = ET.parse("opentsx-retrieval/target/surefire-reports/TEST-org.opentsx.retrieval.system.SystemDocTest.xml").getroot()
          if int(suite.attrib["tests"]) < 14 or any(int(suite.attrib[k]) for k in ("failures", "errors", "skipped")):
              raise SystemExit("catalog freeze validation is missing, skipped or failed")
          required = {
              "catalogOneMatchesSpecAndProcessorDescriptions", "catalogOneRejectsMalformedInventory",
              "catalogOneRejectsMembershipAndVersionDrift", "catalogOneRejectsMissingDescriptionsAndDuplicateDagOperators",
              "catalogOneRequiresStateAndKeys", "catalogOneRequiresMergeMetadata",
              "catalogOneRequiresAvailableWayangSources", "catalogOneRequiresRepositoryVectors",
          }
          executed = {case.attrib["name"].split("(", 1)[0] for case in suite.findall("testcase")}
          if not required.issubset(executed):
              raise SystemExit("one of the catalog freeze regressions was not executed")
          print("Catalog 1 membership, versions and descriptions validated")
          for name, minimum in {"SiteControlSchemaTest": 3, "AggregateEnvelopeSchemaTest": 4}.items():
              suite = ET.parse(f"opentsx-retrieval/target/surefire-reports/TEST-org.opentsx.retrieval.system.{name}.xml").getroot()
              if int(suite.attrib["tests"]) < minimum or any(int(suite.attrib[k]) for k in ("failures", "errors", "skipped")):
                  raise SystemExit(f"{name} is missing, skipped or failed")
          suite = ET.parse("opentsx-kafka-v2/target/surefire-reports/TEST-org.opentsx.kafka.TopicLayoutFederationTest.xml").getroot()
          if int(suite.attrib["tests"]) < 4 or any(int(suite.attrib[k]) for k in ("failures", "errors", "skipped")):
              raise SystemExit("federated topic names were not validated")
          print("Signed bounded JVM admission and federation acceptance executed")
          PYTHON
      - name: Verify recorder PFD through Kafka and Flink
        env:
          KAFSCALE_BOOTSTRAP: 127.0.0.1:39092
        run: xvfb-run --auto-servernum mvn -B -ntp -pl opentsx-flink-core -am verify -Ppfd-acceptance
      - name: Capability report
        if: always()
        run: |
          echo '### KafScale capabilities (${{ env.KAFSCALE_REF }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^#' opentsx-kafscale-conformance/target/kafscale-capabilities.properties >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kafscale-capabilities
          path: |
            opentsx-kafscale-conformance/target/kafscale-capabilities.properties
            opentsx-kafscale-conformance/target/surefire-reports/
            opentsx-kafka-v2/target/surefire-reports/
            opentsx-legacy-bridge/target/surefire-reports/
            opentsx-windpark/target/surefire-reports/
            opentsx-stats/target/surefire-reports/
            opentsx-retrieval/target/surefire-reports/
            opentsx-flink-core/target/pfd-acceptance/
            opentsx-wayang/target/surefire-reports/
            opentsx-wayang/target/federation-test-logs/**/brokers/*.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kafscale-broker-log
          path: ${{ runner.temp }}/kafscale-broker.log

  cross-language:
    name: Java -> Iceberg -> Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-package/pyproject.toml
      - name: Java writes the store-contract fixture to an Iceberg warehouse
        env:
          OPENTSX_EXPORT_DIR: ${{ runner.temp }}/iceberg-export
        run: mvn -B -ntp -pl opentsx-store-iceberg -am test -Dtest=IcebergExportForPythonTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Python reads it with PyIceberg and must reproduce the same bytes
        working-directory: python-package
        env:
          OPENTSX_EXPORT_DIR: ${{ runner.temp }}/iceberg-export
        run: |
          python -m pip install -e ".[iceberg]" pytest
          python -m pytest -q tests/test_iceberg_interop.py
      - name: Java retrieval server (demo store) answers the Python client
        run: |
          mvn -B -ntp -q -pl opentsx-retrieval -am install -DskipTests
          mvn -B -ntp -q -pl opentsx-retrieval dependency:build-classpath -Dmdep.outputFile=cp.txt
          nohup java -cp "opentsx-retrieval/target/classes:$(cat opentsx-retrieval/cp.txt)" \
            org.opentsx.retrieval.server.RetrievalServer --port 18080 --demo true > retrieval-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:18080/v1/health && break; sleep 1; done
          cd python-package && OPENTSX_RETRIEVAL_URL=http://127.0.0.1:18080 python -m pytest -q tests/test_retrieval_client.py

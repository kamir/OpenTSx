name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: xvfb-run --auto-servernum mvn -B -ntp verify
      - name: Launcher classpaths and the staged kafscale-check (bin/opentsx and the staged image, deploy/docker/test-launchers.sh)
        if: matrix.java == '21'
        run: |
          mvn -B -ntp -q install -DskipTests
          bash deploy/docker/test-launchers.sh --dev
          deploy/docker/stage.sh --out "$RUNNER_TEMP/stage"
          bash deploy/docker/test-launchers.sh --staged "$RUNNER_TEMP/stage"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python-package/pyproject.toml
      - name: Install
        run: python -m pip install -e . pytest
      - name: Install the YAML extra
        if: matrix.python == '3.12'
        run: python -m pip install -e ".[yaml]"
      - name: Test
        run: python -m pytest -q
      - name: Documentation links
        if: matrix.python == '3.12'
        working-directory: .
        run: python tools/check_links.py
      - name: Tracked configuration and launcher scripts
        if: matrix.python == '3.12'
        working-directory: .
        run: |
          python tools/check_tracked_config.py
          python -m pytest -q tools

  saas-frontend:
    name: SaaS frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentsx-saas-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: opentsx-saas-frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Types and lint
        run: npx tsc --noEmit && npm run lint
      - name: Test
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: nginx configuration
        run: >-
          docker run --rm
          --add-host opentsx-retrieval:127.0.0.1
          --add-host opentsx-studio:127.0.0.1
          --add-host opentsx-saas-backend:127.0.0.1
          -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.27.4-alpine nginx -t
      - name: nginx answers an unreachable backend as JSON
        run: |
          docker run -d --name fe-nginx -p 8080:8080 --add-host opentsx-retrieval:127.0.0.1 --add-host opentsx-studio:127.0.0.1 --add-host opentsx-saas-backend:127.0.0.1 -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginxinc/nginx-unprivileged:1.27.4-alpine
          curl -sf --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://127.0.0.1:8080/
          test "$(curl -s -o "$RUNNER_TEMP/body.json" -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/mode)" = 502
          test "$(cat "$RUNNER_TEMP/body.json")" = '{"error":"the backend is not reachable","type":"unavailable"}'
          docker rm -f fe-nginx

  saas-backend:
    name: SaaS backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentsx-saas-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: opentsx-saas-backend/requirements*.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q tests

  deploy:
    name: k3s scripts and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and shellcheck
        run: |
          for f in deploy/k3s/*.sh deploy/k3s/test/*.sh deploy/docker/*.sh bin/opentsx bin/000_validate_environment.sh bin/run_all_tests.sh opentsx-saas-backend/local-setup.sh; do bash -n "$f"; done
          command -v shellcheck || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck -x -P SCRIPTDIR deploy/k3s/*.sh deploy/k3s/test/*.sh deploy/docker/*.sh bin/opentsx bin/000_validate_environment.sh bin/run_all_tests.sh opentsx-saas-backend/local-setup.sh
      - name: 20-configure.sh, secrets in docs and the MinIO bucket Job (deploy/k3s/test)
        run: bash deploy/k3s/test/test-20-configure.sh
      - name: 00-prereqs.sh shows the error of the staged kafscale-check (deploy/k3s/test)
        run: bash deploy/k3s/test/test-00-prereqs.sh
      - name: 40-demo.sh, 60-probe.sh, 70-backup.sh and 90-teardown.sh (deploy/k3s/test)
        run: |
          bash deploy/k3s/test/test-40-demo.sh
          bash deploy/k3s/test/test-60-probe.sh
          bash deploy/k3s/test/test-70-backup.sh
          bash deploy/k3s/test/test-90-teardown.sh
      - name: Launchers and logger settings (deploy/docker/test-launchers.sh)
        run: bash deploy/docker/test-launchers.sh
      - name: Launcher commands (bin/opentsx, the image entrypoint and Registry.LOADS_CONF)
        run: bash deploy/docker/test-launchers.sh --commands
      - name: Local compose stack (docker-compose.local.yml) resolves and every image exists
        env:
          POSTGRES_PASSWORD: ci-placeholder-0123
          SECRET_KEY: ci-placeholder-0123456789abcdefghijkl
          FIRST_SUPERUSER_PASSWORD: ci-placeholder-0123
        run: |
          docker compose -f docker-compose.local.yml --profile full config -q
          images="$(docker compose -f docker-compose.local.yml config --images)"
          [ -n "$images" ] || { echo "docker-compose.local.yml: docker compose config --images printed no image; expected postgres, cp-kafka and cp-schema-registry" >&2; exit 1; }
          for image in $images; do
            for _ in 1 2 3; do
              docker manifest inspect "$image" > /dev/null && continue 2
              sleep 5
            done
            echo "docker-compose.local.yml: $image: no such image; pin an image tag that exists" >&2
            exit 1
          done
      - name: Render the kustomize overlays (default, hostnetwork, service, lake, modbus-sim, dwd-forward, monitoring, saas, retrieval-kafscale, event-bridge) and the history archive
        run: |
          kubectl version --client
          mkdir -p "$RUNNER_TEMP/rendered"
          i=0
          for cfg in "KAFSCALE_BOOTSTRAP=10.0.0.5:9092" \
                     "KAFSCALE_BOOTSTRAP=localhost:9092 KAFSCALE_NETWORK=hostnetwork MODBUS_SIM=true DWD_FORWARD=true MONITORING=true" \
                     "KAFSCALE_BOOTSTRAP=10.0.0.5:9092 KAFSCALE_NETWORK=service SAAS=true RETRIEVAL_SOURCE=kafscale RETRIEVAL_DAG_RUNS=true VECTOR_PROCESSOR=true" \
                     "KAFSCALE_BOOTSTRAP=10.0.0.5:9092 LAKE=true INGRESS=true MODBUS_SIM=true DWD_FORWARD=true MONITORING=true SAAS=true EVENT_BRIDGE=true STORAGE_CLASS=local-path"; do
            rm -f deploy/k3s/.env
            deploy/k3s/20-configure.sh $cfg
            i=$((i + 1))
            kubectl kustomize deploy/k3s/overlays/local > "$RUNNER_TEMP/rendered/overlay-$i.yaml"
            kubectl kustomize deploy/k3s/overlays/local/jobs > "$RUNNER_TEMP/rendered/jobs-$i.yaml"
          done
          # history archive (opentsx-market): PVC + CronJobs as a kustomization, the one-off backfill Jobs as plain files
          kubectl kustomize deploy/k3s/history > "$RUNNER_TEMP/rendered/history.yaml"
          cp deploy/k3s/history/*-job.yaml "$RUNNER_TEMP/rendered/"
      - name: Validate the rendered manifests (kubeconform, Kubernetes 1.31 schemas)
        run: |
          # retried: a single 5xx from the release download must not fail the check
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.31.0 "$RUNNER_TEMP"/rendered/*.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load every rendered opentsx/tools container through OpenTsxConf (env, args and OPENTSX_EXTRA_ARGS)
        run: |
          python -m pip install -q -e "python-package[yaml]"
          python - "$RUNNER_TEMP/rendered" <<'PYTHON'
          import base64, json, pathlib, re, shlex, sys
          import yaml
          from opentsx.conf.conf import OpenTsxConf, OpenTsxConfError, Registry

          reg = Registry.shipped()
          COMMANDS = {c["name"] for c in json.loads(reg.text)["commands"]}
          LAUNCHER = {"OPENTSX_HOME", "OPENTSX_CONF_DIR", "OPENTSX_EXTRA_ARGS", "JAVA_OPTS"}
          ARG_REF, SHELL_REF = re.compile(r"\$\(([A-Za-z_]\w*)\)"), re.compile(r"\$\{?([A-Za-z_]\w*)")
          SHELL_RUN = re.compile(r"(?:^|[;&|(\s])opentsx[ \t]+([^;&|<>\n]*)")
          problems = []


          def command_of(argv):
              words = [w for w in argv if not w.startswith("-")]
              return next((" ".join(words[:n]) for n in (3, 2, 1) if " ".join(words[:n]) in COMMANDS), None)


          def variables(command):
              return {n for k, e in reg.entries.items() if command in e["commands"] for n in [Registry.envName(k)] + e.get("env", [])}


          def option_from_variable(where, command, flag, name):
              entry = reg.flags(command).get(flag[2:]) if command else None
              wanted = " or ".join([Registry.envName(entry["key"])] + entry.get("env", [])) if entry else "the variable of the key"
              problems.append(f"{where}: {flag} takes ${name}; drop the option and set {wanted} in the container")


          def check(path, docs, shared):
              maps = {d["metadata"]["name"]: d.get("data", {}) for d in shared if d["kind"] == "ConfigMap"}
              secrets = {d["metadata"]["name"]: {k: base64.b64decode(v).decode() for k, v in d.get("data", {}).items()}
                         for d in shared if d["kind"] == "Secret"}
              links = {}
              for s in (d for d in shared if d["kind"] == "Service"):
                  name, port = s["metadata"]["name"].upper().replace("-", "_"), s["spec"]["ports"][0]["port"]
                  links.update({f"{name}_SERVICE_HOST": "10.43.0.10", f"{name}_SERVICE_PORT": str(port), f"{name}_PORT": f"tcp://10.43.0.10:{port}"})
              for doc in docs:
                  spec = doc.get("spec", {})
                  pod = spec.get("jobTemplate", {}).get("spec", spec).get("template", {}).get("spec", {})
                  for c in pod.get("containers", []):
                      if "/tools:" not in "/" + c["image"]:
                          continue
                      where = f"{path.name} {doc['kind']}/{doc['metadata']['name']}"
                      env = {} if pod.get("enableServiceLinks", True) is False else dict(links)
                      for source in c.get("envFrom", []):
                          env.update(secrets.get(source.get("secretRef", {}).get("name"), {}))
                      declared = [e["name"] for e in c.get("env", [])]
                      for e in c.get("env", []):
                          ref = e.get("valueFrom", {})
                          cm = ref.get("configMapKeyRef")
                          env[e["name"]] = maps.get(cm["name"], {}).get(cm["key"], "") if cm else "x" * 40 if "secretKeyRef" in ref else e.get("value", "")
                      runs, script = [], "\n".join(c.get("args", [])).replace("\\\n", " ") if c.get("command") else None
                      if script is None:
                          args = c.get("args", [])
                          command = command_of(args)
                          for flag, a in zip(args, args[1:]):
                              m = ARG_REF.fullmatch(a)
                              if flag.startswith("--") and m:
                                  option_from_variable(where, command, flag, m.group(1))
                          runs.append(([ARG_REF.sub(lambda m: env.get(m.group(1), m.group(0)), a) for a in c.get("args", [])], True))
                      else:
                          for m in SHELL_RUN.finditer(script):
                              tokens, argv, loadable = shlex.split(m.group(1)), [], True
                              for prev, t in zip([""] + tokens, tokens):
                                  v = re.fullmatch(r"\$\{?(\w+)\}?", t)
                                  if prev.startswith("--") and v and v.group(1) in declared:
                                      option_from_variable(where, command_of(tokens), prev, v.group(1))
                                  t = SHELL_REF.sub(lambda r: env.get(r.group(1), r.group(0)), t)
                                  if "$" in t or "`" in t:
                                      t, loadable = ("x", loadable) if prev.startswith("--") else (t, False)
                                  argv.append(t)
                              runs.append((argv, loadable))
                      commands = [command_of(argv) for argv, _ in runs]
                      readable = LAUNCHER.union(*(variables(cmd) for cmd in commands if cmd))
                      for name in declared:
                          if name not in readable and not (script and name in SHELL_REF.findall(script)):
                              problems.append(f"{where}: {name} is not a variable of {', '.join(filter(None, commands)) or 'the container'}")
                      for (argv, loadable), command in zip(runs, commands):
                          if command is None:
                              problems.append(f"{where}: {' '.join(argv[:3])} is not a command of the registry")
                          elif not loadable:
                              problems.append(f"{where}: opentsx {command}: an argument comes from the shell; pass the value as the variable of its key")
                          else:
                              try:
                                  OpenTsxConf.load(argv + shlex.split(env.get("OPENTSX_EXTRA_ARGS", "")), env, env.get("OPENTSX_CONF_DIR"))
                                  print(f"ok   {where}: opentsx {command}")
                              except OpenTsxConfError as e:
                                  problems.append(f"{where}: opentsx {command}: {e}")


          files = sorted(pathlib.Path(sys.argv[1]).glob("*.yaml"))
          loaded = {f: [d for d in yaml.safe_load_all(f.read_text()) if d] for f in files}
          for f in files:
              render = [g for g in files if re.sub(r"^(overlay|jobs)-", "", g.name) == re.sub(r"^(overlay|jobs)-", "", f.name)]
              check(f, loaded[f], [d for g in render for d in loaded[g]])
          for p in problems:
              print("FAIL " + p)
          sys.exit(1 if problems or not files else 0)
          PYTHON
      - name: Probe plan (60-probe.sh --dry-run, with and without --local-kafscale)
        run: |
          rm -f deploy/k3s/.env
          deploy/k3s/20-configure.sh KAFSCALE_BOOTSTRAP=10.0.0.5:9092
          deploy/k3s/60-probe.sh --dry-run --skip-build --report "$RUNNER_TEMP/probe-plan.md"
          deploy/k3s/60-probe.sh --dry-run --local-kafscale --kafscale-host 10.1.2.3 --report "$RUNNER_TEMP/probe-plan-local.md"
          cat "$RUNNER_TEMP/probe-plan-local.md" >> "$GITHUB_STEP_SUMMARY"

  kafscale-conformance:
    name: KafScale conformance
    runs-on: ubuntu-latest
    env:
      KAFSCALE_REF: v1.6.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/checkout@v7
        with:
          repository: KafScale/platform
          ref: ${{ env.KAFSCALE_REF }}
          path: kafscale
      - uses: actions/setup-go@v7
        with:
          go-version-file: kafscale/go.mod
          cache-dependency-path: kafscale/go.sum
      - name: Build KafScale broker
        working-directory: kafscale
        run: go build -o "$RUNNER_TEMP/kafscale-broker" ./cmd/broker
      - name: Start KafScale broker (in-memory S3 and metadata)
        run: |
          KAFSCALE_USE_MEMORY_S3=1 KAFSCALE_BROKER_ID=0 \
          KAFSCALE_BROKER_ADDR=127.0.0.1:39092 KAFSCALE_BROKER_HOST=127.0.0.1 KAFSCALE_BROKER_PORT=39092 \
            nohup "$RUNNER_TEMP/kafscale-broker" > "$RUNNER_TEMP/kafscale-broker.log" 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/39092) 2>/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/kafscale-broker.log"; exit 1
      - name: Run conformance suite, episode-log, wire round-trip, wind-farm, statistics, event-topic and streaming integration tests
        env:
          KAFSCALE_BOOTSTRAP: 127.0.0.1:39092
        # opentsx-legacy-bridge pulls in opentsx-core, whose Swing tests need a display
        run: xvfb-run --auto-servernum mvn -B -ntp -pl opentsx-kafscale-conformance,opentsx-kafka-v2,opentsx-legacy-bridge,opentsx-windpark,opentsx-stats,opentsx-twin-live,opentsx-retrieval -am test
      - name: Require executed streaming acceptance
        if: always()
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          path = "opentsx-retrieval/target/surefire-reports/TEST-org.opentsx.retrieval.server.KafkaStreamingIntegrationTest.xml"
          suite = ET.parse(path).getroot()
          expected = {
              "httpDeploymentFollowsNewInputAndStopsItsVector",
              "refusesPartialDeploymentBeforeWritingControlRecords",
              "cleaningResumesAnOpenWindowFromItsCheckpoint",
          }
          executed = {case.attrib["name"].split("(", 1)[0] for case in suite.findall("testcase") if case.find("skipped") is None}
          if not expected.issubset(executed) or any(int(suite.attrib[key]) for key in ("failures", "errors", "skipped")):
              raise SystemExit("streaming acceptance is missing, skipped or failed")
          print("All three streaming acceptance cases executed successfully")
          PYTHON
      - name: Verify recorder PFD through Kafka and Flink
        env:
          KAFSCALE_BOOTSTRAP: 127.0.0.1:39092
        run: xvfb-run --auto-servernum mvn -B -ntp -pl opentsx-flink-core -am verify -Ppfd-acceptance
      - name: Capability report
        if: always()
        run: |
          echo '### KafScale capabilities (${{ env.KAFSCALE_REF }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^#' opentsx-kafscale-conformance/target/kafscale-capabilities.properties >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kafscale-capabilities
          path: |
            opentsx-kafscale-conformance/target/kafscale-capabilities.properties
            opentsx-kafscale-conformance/target/surefire-reports/
            opentsx-kafka-v2/target/surefire-reports/
            opentsx-legacy-bridge/target/surefire-reports/
            opentsx-windpark/target/surefire-reports/
            opentsx-stats/target/surefire-reports/
            opentsx-retrieval/target/surefire-reports/
            opentsx-flink-core/target/pfd-acceptance/

  cross-language:
    name: Java -> Iceberg -> Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-package/pyproject.toml
      - name: Java writes the store-contract fixture to an Iceberg warehouse
        env:
          OPENTSX_EXPORT_DIR: ${{ runner.temp }}/iceberg-export
        run: mvn -B -ntp -pl opentsx-store-iceberg -am test -Dtest=IcebergExportForPythonTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Python reads it with PyIceberg and must reproduce the same bytes
        working-directory: python-package
        env:
          OPENTSX_EXPORT_DIR: ${{ runner.temp }}/iceberg-export
        run: |
          python -m pip install -e ".[iceberg]" pytest
          python -m pytest -q tests/test_iceberg_interop.py
      - name: Java retrieval server (demo store) answers the Python client
        run: |
          mvn -B -ntp -q -pl opentsx-retrieval -am install -DskipTests
          bash deploy/docker/test-launchers.sh --classpath opentsx-retrieval
          cp="$(bin/opentsx classpath opentsx-retrieval)"
          nohup java -cp "$cp" org.opentsx.retrieval.server.RetrievalServer --port 18080 --source demo > retrieval-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:18080/v1/health && break; sleep 1; done
          cd python-package && OPENTSX_RETRIEVAL_URL=http://127.0.0.1:18080 python -m pytest -q tests/test_retrieval_client.py

name: Image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - deploy/docker/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentsx-tools:
    name: opentsx-tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test image acceptance controls
        run: python3 -m unittest discover -s deploy/docker -p 'test_*.py' -v
      - name: Scope Maven cache to its workload
        run: |
          test -n "$GITHUB_JOB"
          mkdir -p target/maven-downloads
          printf '%s\n' "$GITHUB_JOB" > target/maven-downloads/cache-context
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
            .mvn/maven.config
            .mvn/ci-settings.xml
            tools/check_maven_downloads.py
            target/maven-downloads/cache-context
      - name: Install Maven 3.9.8
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" \
            https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries/apache-maven-3.9.8-bin.tar.gz
          printf '%s  %s\n' '7d171def9b85846bf757a2cec94b7529371068a0670df14682447224e57983528e97a6d1b850327e4ca02b139abaab7fcb93c4315119e6f0ffb3f0cbc0d0b9a2' "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" | sha512sum --check
          tar xzf "$RUNNER_TEMP/apache-maven-3.9.8-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.8/bin" >> "$GITHUB_PATH"
      - name: Verify Maven download retries
        run: python3 tools/check_maven_downloads.py
      - name: Verify Maven HTTP capture and CI repository routing
        run: python3 tools/check_maven_http_capture.py
      - name: Record Maven cache before builds
        run: python3 tools/maven_cache_report.py "$HOME/.m2/repository" target/maven-downloads/before.json
      - name: Version
        id: version
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args=(--tag "$GITHUB_REF_NAME")
          fi
          version="$(python3 deploy/docker/check_tools_release.py "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build jars
        run: mvn -B -ntp install -DskipTests
      - name: Stage the build context
        run: deploy/docker/stage.sh --with-s3
      - name: Verify staged release versions
        run: python3 deploy/docker/check_tools_release.py --staged deploy/docker/.stage
      - name: S3FileIO runtime classes are on the classpath
        run: |
          for m in opentsx-market opentsx-store-iceberg; do
            grep -q '^lib/m2/dev/failsafe/failsafe/' "deploy/docker/.stage/opt/opentsx/cp/$m.txt" \
              || { echo "$m: failsafe is missing; S3FileIO cannot read" >&2; exit 1; }
          done
      - name: Record Maven cache after builds
        if: always()
        run: python3 tools/maven_cache_report.py "$HOME/.m2/repository" target/maven-downloads/after.json
      - uses: docker/setup-buildx-action@v4
      - name: Build the native candidate
        uses: docker/build-push-action@v7
        with:
          context: deploy/docker/.stage
          file: deploy/docker/opentsx-tools.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: opentsx-tools:acceptance
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
      - name: Verify candidate startup and replay
        env:
          OPENTSX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' opentsx-tools:acceptance)"
          python3 deploy/docker/check_tools_image.py --image "$image_id" \
            --platform linux/amd64 --version "$OPENTSX_VERSION" --revision "$GITHUB_SHA" \
            --output target/image-acceptance/candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-image-acceptance
          path: target/image-acceptance/candidate/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-downloads-opentsx-tools
          path: target/maven-downloads/
          if-no-files-found: error
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: deploy/docker/.stage
          file: deploy/docker/opentsx-tools.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/kamir/opentsx-tools:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

  published-acceptance:
    name: Published tools image ${{ matrix.arch }}
    needs: opentsx-tools
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download and verify the published image
        env:
          OPENTSX_IMAGE: ghcr.io/kamir/opentsx-tools@${{ needs.opentsx-tools.outputs.digest }}
          OPENTSX_VERSION: ${{ needs.opentsx-tools.outputs.version }}
          OPENTSX_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 deploy/docker/check_tools_image.py --image "$OPENTSX_IMAGE" \
            --platform "$OPENTSX_PLATFORM" --version "$OPENTSX_VERSION" --revision "$GITHUB_SHA" \
            --output target/image-acceptance/published
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-image-acceptance-${{ matrix.arch }}
          path: target/image-acceptance/published/

name: Image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - deploy/docker/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opentsx-tools:
    name: opentsx-tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Version
        id: version
        run: |
          version="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          [ -n "$version" ] || { echo "cannot read the project version" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match project version $version" >&2; exit 1; }
            case "$version" in *-*) echo "tag $GITHUB_REF_NAME is not a stable version" >&2; exit 1 ;; esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build jars
        run: mvn -B -ntp install -DskipTests
      - name: Stage the build context
        run: deploy/docker/stage.sh --with-s3
      - name: S3FileIO runtime classes are on the classpath
        run: |
          for m in opentsx-market opentsx-store-iceberg; do
            grep -q '^lib/m2/dev/failsafe/failsafe/' "deploy/docker/.stage/opt/opentsx/cp/$m.txt" \
              || { echo "$m: failsafe is missing; S3FileIO cannot read" >&2; exit 1; }
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: deploy/docker/.stage
          file: deploy/docker/opentsx-tools.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/kamir/opentsx-tools:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

# Dependency updates.
# - archive/ holds old documentation and demos that are not built; updates there have no effect.
# - Major versions are planned migrations, not routine updates: they are ignored here and listed in
#   EVOLUTION/TASK-011-datamodel-refresher-2026.md (backlog "Major-Upgrades"). The same goes for the few
#   minor updates below that are known to break the build.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    exclude-paths:
      - "archive/**"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Avro 1.12.2+ only instantiates trusted classes: register the v2 model and the legacy 2.x classes first
      - dependency-name: "org.apache.avro:*"
      # Iceberg 1.11+ removed GenericAppenderFactory: migrate IcebergIO to the new writer API first
      - dependency-name: "org.apache.iceberg:*"
        update-types: ["version-update:semver-minor"]
      # legacy charts in opentsx-core: JFreeChart 1.5 removed org.jfree.ui
      - dependency-name: "org.jfree:jfreechart"
      # kept equal to the version kafka-clients uses (storage-cost measurements)
      - dependency-name: "com.github.luben:zstd-jni"
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directories: ["/python-package", "/opentsx-saas-backend"]
    schedule:
      interval: weekly
    exclude-paths:
      - "archive/**"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/opentsx-saas-frontend"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.5 needs ESLint 9+ (part of the frontend migration)
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">=0.5.0"]
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

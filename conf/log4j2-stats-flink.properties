# log4j2 settings for bin/opentsx stats-flink (Flink local mini cluster); the same line layout as conf/simplelogger.properties.
appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%t] %level %logger - %msg%n
rootLogger.level = info
rootLogger.appenderRef.stderr.ref = stderr
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn

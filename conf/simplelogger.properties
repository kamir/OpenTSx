# slf4j-simple settings for bin/opentsx and the opentsx-tools image, which put conf/ on the classpath.
# A JVM system property of the same name wins over a line here.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.log.org.apache.iceberg=warn
org.slf4j.simpleLogger.log.org.apache.hadoop=warn
org.slf4j.simpleLogger.log.org.apache.parquet=warn
org.slf4j.simpleLogger.log.software.amazon=warn

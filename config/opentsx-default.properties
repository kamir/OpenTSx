# Default OpenTSx configuration profile
# Override via OPENTSX_CONFIG_FILE or OPENTSX_CONFIG_PROFILE

# Demo defaults
opentsx.demo.output.dir=./data/temp
opentsx.demo.output.format=csv
opentsx.number.of.iterations=3
opentsx.show.gui=false
opentsx.use.kafka=false

# Kafka connection defaults
opentsx.kafka.topic.map.file=config/topiclist.def
opentsx.kafka.client.config.file=config/cpl.props

# Production settings
opentsx.data.directory=./data
opentsx.threads.pool.size=4
opentsx.retry.attempts=3
opentsx.log.level=INFO

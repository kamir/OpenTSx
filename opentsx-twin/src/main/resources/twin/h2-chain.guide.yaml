# Guide to the H2 chain twin (twin/h2-chain.yaml) for the Smart Topics Studio: prose for every atom, port, parameter,
# control and wire, where each value should come from, and references to compare against.
# Read by org.opentsx.twin.studio.StudioGuide and checked against the plan (StudioGuideTest).
# Wire keys use the plan syntax "fromAtom.port -> toAtom.port". Texts are English, like the Studio.
# Comparison values are rough orientation, not a substitute for the sources listed under "references".
twin: h2-chain

intro:
  title: "What is this example about?"
  text:
    - "A 12 MW wind farm feeds in at a shared grid connection point. Behind the same connection sit a 5 MW electrolyzer and a battery. The electrolyzer turns wind power into hydrogen at 30 bar. A compressor pushes it into a buffer store at 50 to 200 bar. A pressure regulator feeds a pipeline at 30 bar from it, and at the end of the pipeline a handover station supplies the customer. What the farm generates and the site does not use goes into the grid and is sold by a direct marketer according to a schedule."
    - "The example shows a fault that runs through the whole chain. At 01:00 the control valve of the handover station closes. The electrolyzer keeps producing 91 kg of hydrogen per hour, but nobody takes it. The regulator holds the pipeline at 30 bar, so the gas stays in the buffer. At 120 bar the buffer still has room for 135 kg, which lasts 89 minutes. At about 02:29 the buffer reaches 200 bar, the electrolyzer shuts down to protect itself, and a good 5 MW that were just producing and compressing hydrogen suddenly flow into the grid. The direct marketer sold 2.93 MW and now has to place 8 MW."
    - "Five parties each see only their part: the customer sees the missing delivery, the operator of the handover station the valve, the operator of the store the pressure, the operator of the electrolyzer the shutdown, the marketer the schedule deviation. The twin computes the chain as a whole. That is why it can say at 01:00 when the buffer will be full, and compare what a forward-looking operating policy would have achieved."
    - "The order compressor, buffer, pipeline is an assumption; no real plant stands behind it. All sizes and pressures are assumed values, all data are synthetic. A low-pressure buffer in front of the compressor would behave differently."
  own: "Run the exported wiring plan with: bin/opentsx twin --plan config/private/h2-chain-own.yaml"
  read:
    - "The columns are the phases of a time step of one minute, from left to right: first the sources (operating rules, market price, customer), then the assets (wind farm, electrolyzer, compressor, handover station, battery), then the power balance at the grid connection point, and last the stocks and accounts (buffer, pipeline, direct marketer)."
    - "A solid line acts in the same minute. Dashed lines are feedback and handovers between blocks of the same column: the value arises at the end of the minute and acts in the next one. This is how the pressure and the headroom of the buffer run back to the electrolyzer, and the protective shutdown runs over these lines. The hydrogen from the electrolyzer to the compressor and from the buffer into the pipeline also arrives one minute later; nothing is lost on the way."
    - "Coloured lines carry flows that enter a balance: blue for electrical power in kW, green for hydrogen in kg/h. Grey lines carry signals: pressure, price, power limit."
    - "A diamond in front of an input means: a time series is bound there from outside, such as the wind potential, the setpoint of the electrolyzer or the schedule of the marketer."
    - "Move the time slider from 01:00 past 02:29 and watch the values at the outputs: first the delivery drops to 0, then the pressure in the buffer rises and with it the power of the compressor, then the power of the electrolyzer falls, then the feed-in jumps."
  change:
    - title: "Parameters in the wiring plan"
      text: "Fixed properties of the assets: rated powers, ramp and minimum load of the electrolyzer, efficiency of the compressor, volume and pressure limits of buffer and pipeline, size of the battery. They are in opentsx-twin/src/main/resources/twin/h2-chain.yaml. Under \"Your data\" you can enter your own values and export them as your own wiring plan."
    - title: "Controls and interventions"
      text: "What is adjusted in operation: the control valve of the handover station, the setpoint of the electrolyzer, the charging and discharging power of the battery, the power limit and the dispatch command of the farm. The closed valve is such an intervention. The view \"Compare\" shows what happens when the valve opens again at different times."
    - title: "Operating policy"
      text: "The rule by which a block chooses its controls. In the reference run the electrolyzer simply follows its setpoint (follow). The alternative pressure-aware throttles it in time, so that the buffer does not reach its pressure limit."
    - title: "Time series at bound inputs"
      text: "Wind potential, offtake demand, schedule and price are constant or simple synthetic series here. In operation they would come from SCADA, from schedule management and from the power market. Real meter values at the grid connection point make the residual between measurement and model visible."

atoms:
  rules:
    title: "Operating rules"
    text: "Collects all restrictions that limit the power of the farm for a while: requirements of the grid operator, shutdowns to protect bats, noise restrictions at night, work on the fields. Each restriction is a time window with a power limit and a reason. The block outputs the strictest limit in force. In the example a bat protection shutdown with 6,000 kW applies from 04:00 to 05:00; in that hour the available power is 2,000 kW below the potential. The window is assumed."
    capture: "No asset. Record the sources of the restrictions: permit with file number, requirements of the grid operator, shutdown algorithms. You enter the time windows themselves as the parameter windows in the wiring plan (from, to, limitKw, reason)."
    ports:
      limit_kw: "The strictest power limit in force in this minute. An empty value means: no restriction."
    params:
      windows:
        text: "The restrictions as time windows: start, end, power limit in kW and reason. Where windows overlap, the strictest limit applies."
        source: "Permit, requirements of the grid operator, shutdown algorithms, agreements with the farmers of the fields."
        compare: "In the example an assumed window from 04:00 to 05:00 with 6,000 kW to protect bats. Real shutdowns depend on season, time of night, wind, temperature and precipitation."

  market:
    title: "Power market"
    text: "Passes the market price into the chain. The price does not change every minute but every quarter of an hour. The block therefore computes only in every fifteenth time step and holds the value in between. In the example the price varies synthetically between 40 and 80 EUR per MWh."
    capture: "No asset. Record the bidding zone, the market segment (day-ahead, intraday) and the data source the price comes from."
    ports:
      price_eur_mwh: "As input: the bound price series from outside. As output: the price that applies in this quarter of an hour."
    params:
      every:
        text: "The block computes only in every n-th time step. With a time step of one minute, 15 steps are a quarter of an hour."
        source: "Settlement interval of the market the power is sold on."
        compare: "A quarter of an hour in intraday trading and in balancing group settlement, an hour or a quarter of an hour in day-ahead trading."
        refs: [smard, entsoe]

  offtake:
    title: "Hydrogen customer"
    text: "The customer behind the handover station, such as an industrial plant or a filling station. Its demand comes from outside: a profile, a supply contract or a forecast. The block passes it on to the handover station as a request and counts what actually arrives. The request is information, not gas."
    capture: "Customer: plant, contact for faults, contractual demand in kg per hour, delivery windows, required minimum pressure and quality, own store if there is one."
    ports:
      demand_kgph: "Demand of the customer in kg per hour, bound as a time series. In the example a constant 91 kg/h, exactly the production of the electrolyzer at full load."
      m_in_kgph: "Hydrogen that arrives from the handover station. The customer reads it one minute later, because the station acts only after its request."
      request_kgph: "The request to the handover station: the demand of this minute."

  park:
    title: "Wind farm"
    text: "The generation of the whole farm at the grid connection point, as one sum, in three quantities. The potential is what the weather would give. The available power is what may be generated after technical and environmental restrictions. The generated power is what actually runs after the dispatch command. The block counts separately how much energy was not generated because of restrictions and how much because of the dispatch command. A kilowatt that a restriction costs does not count again as curtailed."
    capture: "Each wind turbine deserves its own entry: manufacturer, type, serial number, rated power, hub height, rotor diameter, power curve, commissioning date. Add the unit number in the core energy market data register and the farm controller."
    ports:
      p_potential_kw: "Potential from the weather before any restriction, bound as a time series. In the example a constant 8,000 kW, a windy night. From weather data it comes out of a model (transfer to hub height, air density, power curve, wake losses) and is then an estimate, not a measurement."
      limit_kw: "Power limit from the operating rules."
      dispatch_kw: "Free input for a dispatch command given from outside. Without a binding the control of the same name applies."
      p_avail_kw: "Permitted available power: the potential, capped at rated power and the power limit."
      p_gen_kw: "Actually generated power: the available power, capped at the dispatch command."
    controls:
      limit_kw: "Power limit of the farm controller. It follows the input of the same name. Without a limit the rated power applies."
      dispatch_kw: "Dispatch command of the operations management, such as a curtailment for economic reasons. Without a command the rated power applies, so the farm runs everything that is available. In the reference run an intervention sets it to 5,000 kW from 05:00 to 05:30."
    params:
      ratedKw:
        text: "Rated power of the farm at the grid connection point. The farm can never feed in more."
        source: "Sum of the rated powers of all turbines from the nameplate or the core energy market data register, limited by the agreed connection capacity."
        compare: "Single onshore turbines today mostly have 3 to 7 MW. 12 MW are two to four turbines. Over a year an onshore farm generates about 20 to 35 percent of its rated power."
        refs: [mastr, wind-turbine-models, wiki-volllaststunde]

  ely:
    title: "Electrolyzer"
    text: "Turns electricity into hydrogen. It follows a setpoint, but not freely: it can only ramp up and down at a limited rate and does not run below a minimum load. The amount of hydrogen follows from the power divided by the specific electricity demand. When the pressure in the buffer behind the compressor reaches the trip threshold, it ramps down to zero for protection and stays off until the pressure has fallen below the restart threshold."
    capture: "Nameplate and plant documentation: manufacturer, type, serial number, technology (PEM or alkaline), rated power, number and age of the stacks, operating hours, outlet pressure. The specific electricity demand is in the acceptance report."
    ports:
      setpoint_kw: "Power setpoint, bound as a time series. In the example a constant 5,000 kW, that is full load."
      p_downstream_bar: "Pressure in the buffer from the previous minute. It triggers the protective shutdown."
      headroom_kg: "Headroom of the buffer from the previous minute. Only the operating policy pressure-aware uses it."
      m_offtake_kgph: "What the buffer currently gives to the pipeline, from the previous minute. Only the operating policy pressure-aware uses it."
      p_el_kw: "Electrical power drawn."
      m_h2_kgph: "Hydrogen produced: power divided by the specific electricity demand."
    controls:
      setpoint_kw: "Power setpoint. With follow it takes over the bound input. With pressure-aware it is also limited so that production does not exceed the output of the buffer plus its headroom spread over one hour."
    params:
      ratedKw:
        text: "Rated electrical power, the upper bound of the setpoint."
        source: "Nameplate or datasheet; meant is the power drawn by the whole plant including auxiliaries."
        compare: "5 MW is a medium-sized plant. Projects range from below 1 MW to several hundred MW."
        refs: [iea-h2, wiki-elektrolyseur]
      minLoad:
        text: "Minimum load as a share of the rated power. Setpoints below it are rounded to zero or to the minimum load."
        source: "Datasheet of the manufacturer (part-load range)."
        compare: "PEM about 0.05 to 0.10, alkaline about 0.15 to 0.40."
        refs: [wiki-elektrolyseur]
      rampKwPerMin:
        text: "Largest change of power per minute. It determines how fast the electrolyzer follows a setpoint and how long the protective shutdown takes: from 5,000 kW to zero in 10 minutes."
        source: "Datasheet or a measured load step from the operating data."
        compare: "500 kW per minute is 10 percent of the rated power per minute and rather cautious. PEM plants cover the full range in seconds, alkaline ones are slower depending on design and operating state."
        refs: [wiki-elektrolyseur]
      kwhPerKg:
        text: "Specific electricity demand: kilowatt hours of electricity per kilogram of hydrogen, for the whole plant. The model takes it as constant."
        source: "Acceptance report or operating data: electricity at the meter divided by the amount produced over a longer period. The value rises with the age of the stacks."
        compare: "The lower heating value of hydrogen is 33.3 kWh per kg. Plants need about 50 to 58 kWh per kg, that is 57 to 67 percent efficiency relative to the lower heating value."
        refs: [iea-h2, wiki-wasserstoff]
      pTripBar:
        text: "Pressure in the buffer at which the protective shutdown trips."
        source: "Safety concept of the plant. The value is at most the permitted operating pressure of the store."
        compare: "In the example equal to the maximum pressure of the buffer of 200 bar. Because ramping down takes 10 minutes, the pressure in the run rises to 205 bar. In a real plant the threshold therefore lies below the permitted operating pressure, and safety valves that act within seconds protect against overpressure. The model shows the operational ramp-down."
        refs: [dvgw-h2]
      pResumeBar:
        text: "Pressure the buffer must fall below before the electrolyzer may start again. The gap to the trip threshold prevents constant switching on and off."
        source: "Safety concept or setting of the control system."
        compare: "In the example 180 bar, that is 20 bar below the trip threshold. This corresponds to 34 kg of hydrogen that must be delivered first."
      initialKw:
        text: "Power at the start of the run."
        source: "Start condition: the operating state at the start time."
        compare: "In the example 5,000 kW; the plant is already running at full load."

  compressor:
    title: "Hydrogen compressor"
    text: "Raises the hydrogen from the outlet pressure of the electrolyzer to the pressure of the buffer. It passes on what it takes in and draws electricity for it: the higher the pressure in the buffer, the more. The model computes a single stage without intercooling with a fixed efficiency and ideal gas. A real machine has several stages, a performance map and its own limits; that belongs in a test model, not in this block."
    capture: "Nameplate and datasheet: manufacturer, type, serial number, design (piston, diaphragm), number of stages, suction and discharge pressure, flow rate, drive power, operating hours and maintenance intervals."
    ports:
      m_in_kgph: "Hydrogen taken in from the electrolyzer, from the previous minute."
      p_out_bar: "Pressure in the buffer from the previous minute, against which it compresses."
      m_out_kgph: "Hydrogen delivered into the buffer. Equal to the amount taken in; the compressor stores nothing."
      p_el_kw: "Electrical power drawn. In the example 69 kW at 120 bar and 102 kW at 200 bar."
    params:
      pInBar:
        text: "Suction pressure, assumed fixed: the outlet pressure of the electrolyzer."
        source: "Datasheet of the electrolyzer (outlet pressure) and of the compressor (suction pressure)."
        compare: "PEM plants mostly deliver 30 to 40 bar, alkaline ones often only a few bar. A low suction pressure makes compression much more expensive."
        refs: [wiki-elektrolyseur]
      etaIs:
        text: "Isentropic efficiency: the share of the work drawn that ends up in the pressure increase."
        source: "Datasheet or acceptance measurement: electricity at the drive divided by the theoretical compression work."
        compare: "About 0.6 to 0.8. In the example 0.75; this gives 0.76 kWh per kg at 120 bar and 1.12 kWh per kg at 200 bar. With intercooling a real machine needs less."
        refs: [nist-h2]
      tempK:
        text: "Suction temperature in kelvin, assumed constant."
        source: "Temperature sensor at the suction port or the design."
        compare: "288 K is 15 °C."
      ratedKgph:
        text: "Design flow rate. If it is exceeded, the block reports it; the model does not cap the amount, so that no gas disappears."
        source: "Datasheet (flow rate at the design point)."
        compare: "In the example 120 kg/h with 91 kg/h production at full load."

  handover:
    title: "Handover station"
    text: "The point where the hydrogen passes to the customer, with control valve and metering. The station delivers what the customer requests, as far as the valve is open and the pressure at the end of the pipeline is sufficient. What it cannot deliver it reports as shortfall. A closed valve is the typical fault: maintenance, a plant standstill or a full store at the customer. In the example it closes at 01:00 and stays closed. Below the minimum pressure the station delivers nothing in the model; a real regulator would throttle."
    capture: "Handover station: operator, control valve with type and serial number, calibrated flow metering, pressure and quality measurement, agreed minimum delivery pressure, largest throughput and the reporting path for faults."
    ports:
      request_kgph: "Request of the customer in this minute."
      p_in_bar: "Pressure at the end of the pipeline from the previous minute."
      valve: "Free input for a valve position given from outside. Without a binding the control of the same name applies."
      m_out_kgph: "Actual delivery: request times valve position, at most the largest throughput, and only with sufficient pressure."
      p_delivery_bar: "Pressure at which the hydrogen is delivered."
      shortfall_kgph: "Shortfall: request minus delivery."
    controls:
      valve: "Valve position from 0 (closed) to 1 (open). The intervention in the reference run sets it to 0 at 01:00."
    params:
      pMinBar:
        text: "Minimum delivery pressure. If the pressure at the end of the pipeline falls below it, the delivery is interrupted and reported."
        source: "Supply contract with the customer or minimum inlet pressure of its plant."
        compare: "In the example 20 bar, with 28.8 bar at the end of the pipeline in normal operation."
      maxKgph:
        text: "Largest throughput of the station."
        source: "Design of the valve and the metering section."
        compare: "In the example 150 kg/h with a request of 91 kg/h."

  battery:
    title: "Battery store"
    text: "Charges or discharges as instructed, limited by power and state of charge. Positive power means charging and acts like a consumer at the grid connection point, negative means discharging. About 5 percent is lost each when charging and when discharging. In the example the setpoint is zero; the battery does not intervene. It is wired so that alternatives can be computed in which it absorbs the jump in feed-in."
    capture: "Manufacturer, type, serial number of the container and the inverter, cell chemistry, usable capacity, commissioning date, full cycles so far and warranty conditions."
    ports:
      power_kw: "Requested power, bound as a time series. Positive charges, negative discharges. In the example a constant 0."
      p_bat_kw: "Actual power after the limits of inverter and state of charge."
      soc: "State of charge from 0 (empty) to 1 (full)."
    controls:
      power_kw: "Charging or discharging power. It follows the bound input."
    params:
      capacityKwh:
        text: "Usable storage capacity."
        source: "Datasheet (usable, not nominal capacity). In operation from a capacity test, because the capacity falls with age."
        compare: "In the example 2,000 kWh at 1,000 kW, that is two hours at full power. One to four hours is usual."
        refs: [wiki-batteriespeicher]
      powerKw:
        text: "Largest charging and discharging power."
        source: "Rated power of the inverter from the nameplate."
        compare: "In the example 1,000 kW. The jump in feed-in is 5,000 kW, so the battery could absorb only a fifth of it, for about one hour from half full."
        refs: [wiki-batteriespeicher]
      soc0:
        text: "State of charge at the start of the run."
        source: "Start condition: reading of the battery management system at the start time."
        compare: "In the example 0.5, that is half full and usable in both directions."

  grid:
    title: "Grid connection point"
    text: "The power balance at the shared connection, solved anew every minute: generation minus electrolyzer, battery and auxiliary demand (here the compressor) gives the feed-in to the grid. A negative value means drawing from the grid. The block also reports how much of the generation was used directly on site and assigns it to the consumers in a fixed order. If the meter at the connection is bound, the residual shows the deviation between measurement and model."
    capture: "Grid connection point and substation: grid operator, voltage level, agreed connection capacity, transformer (manufacturer, type, serial number), metering point identifier and metering operator."
    ports:
      p_gen_kw: "Generation of the wind farm."
      p_self_kw: "Auxiliary demand at the site. In the example the power of the compressor; other auxiliaries such as water treatment are not modelled."
      p_ely_kw: "Power drawn by the electrolyzer."
      p_bat_kw: "Power of the battery. Charging is positive and counts as consumption."
      p_grid_meas_kw: "Free input for the measured value of the grid meter."
      p_grid_kw: "Feed-in to the grid. Positive is feed-in, negative is drawing from the grid."
      p_direct_kw: "Part of the generation that is used directly on site without using the public grid."
      residual_kw: "Measured minus computed feed-in. Present only when p_grid_meas_kw is bound."
    params:
      priority:
        text: "Order in which the generation is assigned to the consumers: self is the auxiliary demand, ely the electrolyzer, bat the battery. It does not change the feed-in, only the split of the energy used directly."
        source: "Metering concept and contracts: who counts as supplied directly by the farm? This matters for levies and for proving green hydrogen."
        compare: "In the example auxiliary demand before electrolyzer before battery."

  buffer:
    title: "Hydrogen buffer"
    text: "A pressure store behind the compressor that decouples production and offtake in time. The model computes it as a vessel with fixed volume and fixed temperature by the ideal gas law: each additional kilogram raises the pressure by 0.59 bar. The block includes the pressure regulator that feeds the pipeline: it replaces what the handover station takes and moves the pipeline pressure towards its setpoint. It cannot take anything back, and it does not empty the buffer below the minimum pressure. Inflow minus outflow gives the pressure, the headroom up to the maximum pressure and the time until the limit is reached at the current inflow. This time is the actual early warning."
    capture: "Vessel record: manufacturer, year of construction, geometric volume, permitted operating pressure, material, date of the last inspection, pressure and temperature measuring points with type and serial number, and the pressure regulator to the pipeline."
    ports:
      m_in_kgph: "Inflow from the compressor."
      m_draw_kgph: "What the handover station takes from the pipeline in this minute. The regulator replaces this amount."
      p_line_bar: "Pressure in the pipeline from the previous minute, which the regulator moves towards its setpoint."
      m_out_kgph: "Output to the pipeline."
      p_bar: "Pressure in the buffer at the end of the minute."
      ttl_min: "Time in minutes until the maximum pressure is reached if the inflow stays as it is. Empty as long as the pressure does not rise."
      headroom_kg: "Headroom: kilograms that still fit in until the maximum pressure is reached."
      m_net_kgph: "Inflow minus output. Positive means: the buffer is filling."
    params:
      volumeM3:
        text: "Geometric volume of the store. It determines how much gas fits in per bar."
        source: "Vessel record. 20 m³ are for example eight tubes of 2.5 m³ each."
        compare: "In the example 135 kg fit in between 120 and 200 bar, 253 kg between 50 and 200 bar. Double the volume means double the buffer time."
        refs: [wiki-ideales-gas]
      tempK:
        text: "Gas temperature in kelvin, assumed constant. A real store warms up while filling and cools down while emptying."
        source: "Temperature sensor at the vessel or the ambient temperature."
        compare: "288 K is 15 °C."
      p0Bar:
        text: "Pressure at the start of the run."
        source: "Start condition: reading of the pressure measurement at the start time."
        compare: "In the example 120 bar, somewhat below the middle of the working range."
      pMinBar:
        text: "Minimum pressure. Below it the regulator gives nothing more and reports \"buffer empty\"."
        source: "Design of the regulator: it needs a pressure drop to the pipeline."
        compare: "In the example 50 bar with 30 bar pipeline pressure."
      pMaxBar:
        text: "Highest permitted operating pressure. Exceeding it raises the event \"pressure limit\"."
        source: "Vessel record or acceptance certificate (permitted operating pressure)."
        compare: "Stationary stores often work at 200 to 500 bar. The model computes with ideal gas; at 200 bar a real store holds about a tenth less hydrogen than computed here."
        refs: [dvgw-h2, nist-h2, wiki-ideales-gas]
      warnMin:
        text: "Warning time: if the time until the pressure limit falls below this value, a warning is raised."
        source: "Your own decision: how long do the control room and the operator need to react?"
        compare: "In the example 60 minutes. The warning comes at 01:29, one hour before the shutdown."
      lineSetBar:
        text: "Setpoint of the pressure regulator for the pipeline."
        source: "Setting of the regulator, matched to the operating pressure of the pipeline."
        compare: "In the example 30 bar, the middle between minimum and maximum pressure of the pipeline."
      gainKgphPerBar:
        text: "How strongly the regulator responds to a deviation of the pipeline pressure: additional output in kg per hour per bar below the setpoint."
        source: "Regulator parameter. Chosen cautiously in the model, because the pressure comes back only in the following minute."
        compare: "In the example 20 kg/h per bar."
      maxOutKgph:
        text: "Largest output of the regulator."
        source: "Design of the regulator."
        compare: "In the example 200 kg/h."
      initialOutKgph:
        text: "Output at the start of the run."
        source: "Start condition: the flow at the start time."
        compare: "In the example 91 kg/h; the plant is already running in equilibrium."

  line:
    title: "Hydrogen pipeline"
    text: "The pipeline between the buffer and the handover station. Its content is a second, small store: the model computes it as a vessel with fixed volume and fixed temperature by the ideal gas law; each additional kilogram raises the pressure by 0.076 bar. The pipeline has two pressures. The pressure at the start is that of the content. The pressure at the end lies below it by a loss that grows with the square of the amount taken. This is a rough approximation without pipe friction from length, diameter and roughness and without an elevation profile. The gas in the pipeline is counted here and nowhere else."
    capture: "Pipeline record: operator, nominal diameter, length, material, roughness, elevation profile, permitted operating pressure, year of construction, date of the last pressure test, location of the pressure measuring points with type and serial number of the transmitters."
    ports:
      m_in_kgph: "Inflow from the buffer, from the previous minute."
      m_out_kgph: "Outflow to the handover station."
      p_in_bar: "Pressure at the start of the pipeline at the end of the minute; the pressure of the pipeline content."
      p_out_bar: "Pressure at the end of the pipeline: the pressure at the start minus the pressure loss."
      linepack_kg: "Hydrogen that stands in the pipeline."
      m_net_kgph: "Inflow minus outflow. Positive means: the pipeline is filling."
    params:
      volumeM3:
        text: "Geometric volume of the pipeline. It determines how much gas fits in per bar."
        source: "Pipeline record: inner cross-section times length. 157 m³ correspond to 5 km of pipe with 200 mm inner diameter."
        compare: "In the example almost 400 kg stand in the pipeline at 30 bar."
        refs: [wiki-ideales-gas]
      tempK:
        text: "Gas temperature in kelvin, assumed constant."
        source: "Soil temperature at laying depth or a temperature sensor on the pipeline."
        compare: "288 K is 15 °C. Buried pipelines stay between about 5 and 15 °C over the year."
      p0Bar:
        text: "Pressure at the start of the run."
        source: "Start condition: reading of the pressure measurement at the start time."
        compare: "In the example 30 bar, the setpoint of the regulator."
      pMinBar:
        text: "Minimum pressure. Below it the pipeline reports \"pressure low\"."
        source: "Operating concept of the pipeline."
        compare: "In the example 20 bar."
      pMaxBar:
        text: "Highest permitted operating pressure. Exceeding it raises the event \"pressure limit\"."
        source: "Pipeline record or acceptance certificate of the pipeline (permitted operating pressure)."
        compare: "Distribution grids work up to 16 bar, high-pressure pipelines above that, transmission pipelines at about 55 to 100 bar. The model computes with absolute pressure; operating pressures are mostly given as gauge pressure. At 40 bar real hydrogen deviates from the ideal gas by about 2 to 3 percent."
        refs: [dvgw-h2, nist-h2, wiki-ideales-gas]
      dropBar:
        text: "Pressure loss between start and end at the reference flow."
        source: "Measured pressure drop at a known flow, or a pipe network calculation."
        compare: "In the example 1.5 bar at 100 kg/h, that is 1.24 bar at 91 kg/h."
      dropRefKgph:
        text: "Flow to which the pressure loss refers."
        source: "The measuring point at which the pressure loss was determined."
        compare: "In the example 100 kg/h."
      initialOutKgph:
        text: "Outflow at the start of the run, for the pressure at the end of the pipeline in the first minute."
        source: "Start condition: the flow at the start time."
        compare: "In the example 91 kg/h."

  marketer:
    title: "Direct marketer"
    text: "Sells the electricity fed in on the market and has registered a schedule for it. Every minute the block compares the actual feed-in with the schedule. A positive deviation is electricity that must be sold in addition, a negative one is electricity that must be bought back. Deviations are settled per quarter of an hour as balancing energy. This can mean costs or a credit. The model does not compute this settlement: the revenue is only feed-in times market price and therefore incomplete."
    capture: "Contract partner and contract number, balancing group, deadlines for schedule changes, rules for balancing energy and the reporting path for faults."
    ports:
      p_grid_kw: "Actual feed-in at the grid connection point."
      schedule_kw: "Registered schedule, bound as a time series. In the example a constant 2,930 kW: 8,000 kW of wind minus 5,000 kW for the electrolyzer minus about 70 kW for the compressor. The schedule is the contract with the market; the feed-in at the grid connection point is the physics. These are two things."
      price_eur_mwh: "Market price of the current quarter of an hour."
      deviation_kw: "Feed-in minus schedule. After the shutdown of the electrolyzer plus 5,070 kW."
    params:
      toleranceKw:
        text: "Deviation from which the event \"schedule deviation\" is raised."
        source: "Contract with the direct marketer or your own reporting threshold."
        compare: "In the example 100 kW, a good 3 percent of the schedule. The compressor alone shifts the feed-in by 33 kW between 120 and 200 bar."
        refs: [wiki-direktvermarktung, wiki-ausgleichsenergie]

wires:
  "rules.limit_kw -> park.limit_kw": "The power limit from the operating rules goes to the farm controller. The farm then offers at most this value as available, even if there were more wind, and counts the difference as energy not generated because of restrictions. In the example a limit of 6,000 kW applies from 04:00 to 05:00. Outside the window the value is empty, and the farm is limited only by its rated power of 12,000 kW."
  "park.p_gen_kw -> grid.p_gen_kw": "The generation of the wind farm enters the power balance at the grid connection point. In the example it is 8,000 kW throughout. It is the only source of the balance. Everything that electrolyzer, compressor and battery do not take of it becomes feed-in."
  "ely.p_el_kw -> grid.p_ely_kw": "The power drawn by the electrolyzer as the largest consumer behind the connection. Up to the protective shutdown it is 5,000 kW. After that it falls by 500 kW per minute and is at zero after 10 minutes. Exactly these 5,000 kW then show up as additional feed-in."
  "compressor.p_el_kw -> grid.p_self_kw": "The power of the compressor as auxiliary demand in the power balance. It rises with the pressure in the buffer from 69 kW at 120 bar to 102 kW at 200 bar and falls to zero with the electrolyzer. Without this line the schedule of the marketer would be wrong by this amount."
  "battery.p_bat_kw -> grid.p_bat_kw": "The power of the battery in the power balance. Charging counts like a consumer and lowers the feed-in, discharging raises it. In the example it is 0. The line is the starting point for alternatives in which the battery cushions the jump after the shutdown."
  "ely.m_h2_kgph -> compressor.m_in_kgph": "The hydrogen produced goes into the compressor. At 5,000 kW and 55 kWh per kg this is 91 kg per hour. Dashed, because both blocks compute in the same column: the compressor sees the amount of the previous minute."
  "compressor.m_out_kgph -> buffer.m_in_kgph": "The compressed hydrogen flows into the buffer. As long as the handover station takes the same amount, the pressure in the buffer stays put. After the valve closes, this flow fills the buffer at 54 bar per hour."
  "buffer.m_out_kgph -> line.m_in_kgph": "What the pressure regulator gives from the buffer into the pipeline. Up to 01:00 it is 91 kg per hour, after that 0: the pipeline is at its setpoint, so the gas stays in the buffer. Dashed, because the amount arrives in the pipeline in the following minute."
  "handover.m_out_kgph -> line.m_out_kgph": "The withdrawal of the handover station from the pipeline. Up to 01:00 it is 91 kg per hour, after that 0. This one line sets off the whole chain: without outflow the regulator stops topping up, and the buffer fills until the electrolyzer shuts down."
  "handover.m_out_kgph -> offtake.m_in_kgph": "The hydrogen delivered arrives at the customer. This is the physical connection to the customer. Dashed, because the customer counts the delivery only in the following minute."
  "offtake.request_kgph -> handover.request_kgph": "The request of the customer to the handover station. Information, not gas: it says how much the customer wants in this minute."
  "line.p_out_bar -> handover.p_in_bar": "The pressure at the end of the pipeline at the handover station. If it falls below the minimum delivery pressure of 20 bar, the station interrupts the delivery. In the example it is 28.8 bar. Dashed, because the value comes from the previous minute."
  "line.p_in_bar -> buffer.p_line_bar": "The pipeline pressure back to the pressure regulator of the buffer. If it is below the setpoint of 30 bar, the regulator gives more; if it is above, less. Dashed, because the value acts in the following minute."
  "handover.m_out_kgph -> buffer.m_draw_kgph": "The same withdrawal as information for the pressure regulator. Every minute it replaces what the station takes, and it needs the pipeline pressure only for the correction."
  "buffer.p_bar -> compressor.p_out_bar": "The pressure in the buffer against which the compressor works. The fuller the buffer, the more electricity each kilogram needs. Dashed, because the value comes from the previous minute."
  "buffer.p_bar -> ely.p_downstream_bar": "The feedback over which the protective shutdown runs. The electrolyzer sees the pressure from the end of the previous minute. At 200 bar it ramps down to zero and reports \"protective shutdown\". Because ramping down takes 10 minutes, the pressure still rises to 205 bar. It starts again only when the pressure has fallen to 180 bar. Since the valve stays closed in the example, the pressure does not fall, and the electrolyzer stays off."
  "buffer.headroom_kg -> ely.headroom_kg": "The headroom of the buffer in kilograms, back to the electrolyzer. At the start it is 135 kg. In the reference run the information stays unused; the plant runs into the shutdown with its eyes open. The operating policy pressure-aware uses it to throttle in time and approaches the limit without reaching it. Dashed, because the value acts only in the following minute."
  "buffer.m_out_kgph -> ely.m_offtake_kgph": "The output of the buffer as information for the electrolyzer. In the reference run with the operating policy follow it is not used. The operating policy pressure-aware needs it: it allows only as much production as the buffer currently gives, plus its headroom spread over one hour."
  "grid.p_grid_kw -> marketer.p_grid_kw": "The feed-in at the grid connection point goes to the direct marketer. Up to the shutdown it is about 2,930 kW, the schedule. After that it rises to 8,000 kW in 10 minutes. Here the marketer learns the consequence of a fault that began an hour and a half earlier at the other end of the chain."
  "market.price_eur_mwh -> marketer.price_eur_mwh": "The market price of the current quarter of an hour for the revenue: feed-in in MW times hours times price. At 2.93 MW and 60 EUR per MWh this is 176 EUR per hour. The price changes only every 15 minutes, so the market block computes only in every fifteenth time step."


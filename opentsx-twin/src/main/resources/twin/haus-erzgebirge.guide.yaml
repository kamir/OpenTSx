# Guide to the house twin (twin/haus-erzgebirge.yaml) for the Smart Topics Studio: prose for every atom, port,
# parameter, control and wire, where each value should come from, and references to compare against.
# Read by org.opentsx.twin.studio.StudioGuide and checked against the plan (StudioGuideTest): every wire, port and
# parameter of the plan must be explained here, and nothing may be explained that the plan does not have.
# Wire keys use the plan syntax "fromAtom.port -> toAtom.port". Texts are English, like the Studio.
# Comparison values are rough orientation, not a substitute for the sources listed under "references".
twin: haus-erzgebirge

intro:
  title: "What is this example about?"
  text:
    - "The example is a single-family house in the Erzgebirge with two residents, an oil boiler for radiators and hot water, and a wood stove in the living room. There is no photovoltaic system and no heat pump. The twin recomputes a whole year in hourly steps and answers one question: what does the current operation of heating, hot water and appliances cost, and what would another operation achieve with the same weather and the same comfort?"
    - "Each box is a block with its own state, for example the level in the tank or the room temperature. Each line carries exactly one quantity from an output to an input. Three balances have to add up: heat (boiler, stove, appliances and sun against the loss through the building envelope), fuel (oil from the tank, wood from the store) and electricity (appliances and heating at the meter)."
    - "All numbers are invented example assumptions. They hold until you replace them with your own values: nameplate, bill, reading or measurement. Savings from the twin are modelled, not proven."
  own: "Run the exported wiring plan with: bin/opentsx house --plan config/private/haus-erzgebirge-own.yaml"
  read:
    - "The columns are the phases of a time step, from left to right: first the sources (weather, hot water demand, appliances), then the assets (stove, boiler), then the power balance at the meter, and last the stocks (building, tank, wood store)."
    - "A solid line acts in the same hour. A dashed line is feedback: the value arises at the end of the hour and acts only in the next one. This is how the thermostat of the building requests the heat for the following hour from the boiler."
    - "Coloured lines carry flows that enter a balance: orange for heat in kW, brown for fuel in l/h and Ster/h, blue for electricity in kW. Grey lines carry signals, that is information such as temperature, level or heating season."
    - "Move the mouse over a line to read what it carries and why. A click on a line or a block shows its details in the panel on the right."
    - "The numbers at the outputs are means over 5 hours, because the year is condensed for display. The stove delivers 4.2 kW while burning. If it shows 2.5 kW, it burned in three of the five hours."
  change:
    - title: "Parameters in the wiring plan"
      text: "Fixed properties of the house and the appliances, such as heat loss, boiler power, tank size or prices. They are in the file opentsx-twin/src/main/resources/twin/haus-erzgebirge.yaml. In the section \"Your data\" you can enter your own values and export them as your own wiring plan."
    - title: "Controls"
      text: "What can be adjusted in operation: room setpoint, night setback, burning time of the stove, storage temperature, pump power, deliveries. Each change is an intervention with a timestamp. The view \"Compare\" compares such interventions with the reference year."
    - title: "Measurements at free inputs"
      text: "Inputs without a line wait for real data: outdoor temperature of a DWD station, meter reading, dipstick reading in the tank, amount of wood from the wood log. Once a measurement is bound, it replaces the assumption, and the block reports the deviation between measurement and model as a residual."
    - title: "Calibration against bills"
      text: "The twin sets the most uncertain parameters (heat loss of the building, scaling of hot water and appliances) itself when you enter your bills: bin/opentsx house --calibrate config/private/abrechnungen.csv"

atoms:
  weather:
    title: "Weather at the site"
    text: "Delivers the outdoor temperature and the solar irradiance for every hour. As long as no measurement is bound, the block generates a synthetic climate from the annual cycle, the daily cycle and weather spells. It is reproducible, but invented. It also counts the degree days G20/15, which make years with different weather comparable."
    capture: "No device in the house. Record the nearest DWD station here (name, station id, altitude) or your own outdoor thermometer."
    ports:
      t_out_meas_c: "Free input for a measured outdoor temperature, for example hourly values of the nearest DWD station. Once it is bound, the measurement wins over the synthetic climate."
      ghi_meas_w_m2: "Free input for measured global horizontal irradiance. Without a binding a daily cycle is computed from the position of the sun and a cloud factor per day."
      t_out_c: "Outdoor temperature of the hour. It determines the heat loss of the building."
      ghi_w_m2: "Global horizontal irradiance. In the building it becomes the solar heat gain."
    params:
      meanC:
        text: "Annual mean of the outdoor temperature of the synthetic climate."
        source: "Long-term mean of the nearest DWD station at a similar altitude. With bound station data the parameter is not needed."
        compare: "Germany on average about 9 to 10 °C, low mountain ranges at 600 to 700 m about 6 to 7 °C."
        refs: [dwd-cdc]
      seasonAmpC:
        text: "Half the difference between the warmest and the coldest monthly mean."
        source: "From the monthly means of the station: (warmest month minus coldest month) divided by 2."
        compare: "In Central Europe about 8 to 10 K."
        refs: [dwd-cdc]
      dailyAmpC:
        text: "Mean difference between daily maximum and daily minimum."
        source: "From hourly values of the station. In summer the daily cycle is larger than in winter; the model takes this into account."
        compare: "Typically 4 to 8 K."
        refs: [dwd-cdc]
      seed:
        text: "Start value of the random generator for the weather spells. The same value means exactly the same weather."
        source: "Free to choose. Another value gives another, equally plausible year."
        compare: "No physical meaning."
      latitude:
        text: "Geographic latitude. It determines the position of the sun and the length of the day."
        source: "Map or address of the house."
        compare: "Germany lies between about 47.3 and 55.1 degrees north."
      longitude:
        text: "Geographic longitude. It shifts the highest position of the sun against the clock time."
        source: "Map or address of the house."
        compare: "Germany lies between about 5.9 and 15.0 degrees east."

  dhw:
    title: "Hot water"
    text: "Computes how much heat the boiler has to deliver for hot water: the draws in the morning and the evening and the loss of the cylinder, which is kept warm around the clock. The demand occurs all year, also in summer."
    capture: "Hot water cylinder: manufacturer, type, content in litres, year of construction and the standing loss from the nameplate or energy label."
    ports:
      t_store_c: "Free input for a given storage temperature. Without a binding the control of the same name applies."
      q_dhw_kw: "Heat the boiler has to provide for hot water in this hour: draws plus cylinder loss."
    controls:
      t_store_c: "Storage temperature. A lower temperature reduces the cylinder loss. Below 55 to 60 °C the risk of legionella rises; clarify this before lowering it."
    params:
      persons:
        text: "Number of residents who draw hot water."
        source: "Your own household size."
        compare: "Example: 2."
      litresPerPersonDay:
        text: "Hot water per person and day at use temperature."
        source: "Most precise with a hot water meter. Otherwise estimate: showers times duration times flow, plus kitchen."
        compare: "Mostly 25 to 50 litres per person and day at 45 °C."
        refs: [uba-warmwasser]
      tUseC:
        text: "Temperature at which the amount in litres is counted."
        source: "Convention. 45 °C corresponds roughly to a shower with some reserve."
        compare: "40 to 45 °C."
      tColdC:
        text: "Cold water temperature at the house connection."
        source: "Measure with a thermometer at the cold water tap after letting it run for a while."
        compare: "About 10 to 12 °C over the year."
      storeLossW:
        text: "Standing loss of the cylinder at 60 °C in watts."
        source: "Nameplate or energy label of the cylinder (standing loss in W or in kWh per 24 h; 1 kWh per 24 h is about 42 W)."
        compare: "A 150 litre cylinder loses about 40 to 100 W depending on its insulation."
        refs: [uba-warmwasser]
      tStoreC:
        text: "Start value of the control storage temperature."
        source: "Read the setting at the cylinder thermostat or at the boiler control."
        compare: "55 to 60 °C is usual."
        refs: [wiki-legionellen]
      scale:
        text: "Factor on the whole hot water demand. It is a calibration parameter."
        source: "Stays 1.0 until the calibration against bills adjusts it. Best taken from the oil consumption in summer, when only hot water runs."
        compare: "After calibration mostly between 0.5 and 1.5."

  appliances:
    title: "Appliances and residents"
    text: "Computes the household electricity of every hour from an inventory with power, standby and times of use. Everything that uses electricity inside the heated rooms turns into heat there. Add the body heat of the people at home. The block therefore has two outputs: electricity for the meter and heat gain for the building."
    capture: "Each appliance deserves its own entry: manufacturer, model, serial number, year of construction and the values from the energy label. Record them in the note or directly in the appliance list (parameter inventory)."
    ports:
      p_el_kw: "Electrical power of all appliances in this hour, including standby."
      q_gain_kw: "Internal heat gain: the electricity of the appliances inside the envelope plus the body heat of the people at home."
    controls:
      standby_off: "1 means: switchable standby is off, for example with power strips."
      "factor.*": "Factor per appliance on its consumption. 0.4 stands for a new appliance with 60 percent less consumption, 0.7 for 30 percent less use."
    params:
      scale:
        text: "Factor on the whole appliance electricity. It is a calibration parameter."
        source: "Stays 1.0 until the calibration against the electricity bill adjusts it."
        compare: "If it is far from 1, an appliance is missing from the inventory or the times of use are wrong."
      persons:
        text: "Number of people who give off body heat."
        source: "Your own household size."
        compare: "Example: 2."
      personW:
        text: "Heat given off per person at home."
        source: "Guide value from indoor climate engineering, rarely to be adjusted."
        compare: "About 70 to 100 W at rest."
      homeWeekday:
        text: "Hours in which somebody is at home on working days. \"16-24\" means from 16:00 to 24:00."
        source: "Your own daily routine."
        compare: "Example: away from 7:00 to 16:00."
      homeWeekend:
        text: "Presence at the weekend."
        source: "Your own daily routine."
        compare: "Example: all day."
      inventory:
        text: "The appliance list. Continuous appliances such as the fridge and the freezer have a mean power avgW. Switched appliances have a power w in the time windows weekday and weekend and a standby power standbyW outside them. inside: false marks appliances outside the heated envelope, whose waste heat does not heat the house. seasonal raises the use in winter, for example for lighting."
        source: "Power from the nameplate or the energy label (kWh per year divided by 8760 hours gives the mean power in kW). Most precise is a plug-in power meter over one week."
        compare: "Electricity benchmark: comparison values for households by number of persons and building type."
        refs: [stromspiegel]

  stove:
    title: "Wood stove in the living room"
    text: "Burns split logs in the evening during the heating season and gives the heat directly to the room. What the stove delivers the boiler does not have to deliver. The stove has a lower efficiency than the boiler, but wood is cheaper and better in the CO2 balance. That is why the twin reports cost, CO2 and energy separately."
    capture: "Nameplate on the back or in the wood compartment: manufacturer, type, rated heat output in kW, efficiency, year of construction. Add the date of the last inspection by the chimney sweep."
    ports:
      season: "Heating season signal from the building. Outside the heating season the stove stays cold."
      wood_kwh_per_day: "Free input for the wood energy actually burned per day, for example from the wood log or the bill. Once it is bound, the stove burns exactly this amount, regardless of the heating season."
      q_heat_kw: "Heat output to the room: fuel power times efficiency."
      wood_ster_ph: "Wood consumption in Ster per hour: fuel power divided by the energy content per Ster."
    controls:
      hours_per_day: "Burning time per evening in hours. The time window ends at the hour endH."
      fuel_kw: "Fuel power while burning in kW, that is how much wood is put on per hour."
    params:
      fuelKw:
        text: "Fuel power while burning. Times the efficiency it gives the heat output (6 kW times 0.70 gives 4.2 kW)."
        source: "Rated heat output from the nameplate divided by the efficiency. Or from the wood log: amount put on per hour times energy content."
        compare: "Wood stoves mostly have a rated heat output of 4 to 8 kW."
        refs: [uba-kaminofen]
      eta:
        text: "Efficiency: share of the fuel energy that arrives in the room."
        source: "Nameplate or test report of the stove."
        compare: "Older stoves 50 to 70 percent, newer ones 75 to 85 percent. Damp wood lowers the value considerably."
        refs: [uba-kaminofen, bimschv-1]
      hoursPerDay:
        text: "Start value of the control burning time per evening."
        source: "Your own habit. A wood log (baskets per week) makes the value reliable."
        compare: "Example: 4 hours, from 18:00 to 22:00."
      endH:
        text: "Time at which the fire goes out."
        source: "Your own habit."
        compare: "Example: 22:00."
      kwhPerSter:
        text: "Energy content of one Ster (one cubic metre of stacked split logs), air-dry."
        source: "Wood species and moisture. The value is not on the bill; it follows from the wood species."
        compare: "Spruce about 1,500 kWh per Ster, beech about 2,000 kWh per Ster for air-dry wood."
        refs: [lwf-holz]

  boiler:
    title: "Oil boiler"
    text: "Turns heating oil into heat. It serves the hot water first and then the request of the building, together at most up to the rated power. Below the minimum load the single-stage burner cycles, and the efficiency drops. In the model the boiler is kept warm all year and uses oil for it even without heat demand. The circulation pump and the burner need electricity. When the tank is empty, the boiler delivers no heat."
    capture: "Nameplate on the boiler: manufacturer, type, serial number, rated heat output, year of construction. Add the burner (type, nozzle size), the circulation pump (type, power drawn) and the flue gas loss from the measurement report of the chimney sweep."
    ports:
      q_req_kw: "Heat request of the thermostat for this hour, computed by the building at the end of the previous hour."
      q_dhw_kw: "Heat demand for hot water. It is served first."
      season: "Heating season signal. Only then does the circulation pump run."
      tank_level_l: "Level of the tank from the previous hour. At zero litres the burner goes into fault."
      q_space_kw: "Space heat the boiler actually delivers to the radiators."
      fuel_lph: "Oil consumption in litres per hour, including the standby loss."
      p_el_kw: "Electricity for the circulation pump and the burner."
    controls:
      space_enabled: "1 is heating operation, 0 is summer operation with hot water only."
      pump_w: "Power drawn by the circulation pump in watts. Replacing it with a high-efficiency pump is an intervention to 8 W here."
    params:
      ratedKw:
        text: "Rated heat output of the boiler, the upper bound for hot water and space heat together."
        source: "Nameplate of the boiler."
        compare: "The example house needs about 7 kW at minus 14 °C. At 18 kW the boiler is clearly oversized, like many existing boilers."
        refs: [wiki-heizlast]
      eta:
        text: "Efficiency above the minimum load, relative to the lower heating value."
        source: "100 percent minus the flue gas loss from the report of the chimney sweep, minus about 1 to 2 percentage points of radiation loss."
        compare: "Old constant-temperature boilers about 0.80 to 0.87, low-temperature boilers 0.87 to 0.93, condensing boilers up to about 0.98 and above."
        refs: [wiki-niedertemperaturkessel]
      minLoad:
        text: "Load threshold below which the model applies cycling losses."
        source: "An estimate for single-stage burners. Counting burner starts per hour helps to narrow the value down."
        compare: "A single-stage burner has no part load; it cycles at any load below the rated power. 0.35 is a model assumption, not a nameplate value."
      cyclingLoss:
        text: "Largest reduction of the efficiency when cycling, reached at very low load."
        source: "Estimate. The calibration against bills cannot separate it from the efficiency."
        compare: "About 0.05 to 0.20."
      standbyKw:
        text: "Standby loss as fuel power: oil that only keeping the boiler warm costs, all year."
        source: "Easiest from the oil consumption in a summer week without draws. Otherwise the manufacturer's standby loss in percent times the rated power."
        compare: "About 1 to 3 percent of the rated power, so 0.2 to 0.5 kW at 18 kW."
        refs: [wiki-niedertemperaturkessel]
      burnerW:
        text: "Power drawn by the burner (fan, oil pump, ignition) while firing."
        source: "Nameplate of the burner or a plug-in power meter."
        compare: "About 100 to 250 W."
      pumpW:
        text: "Start value of the control pump power."
        source: "Nameplate of the pump. For multi-stage pumps the set stage applies."
        compare: "Uncontrolled old pumps 45 to 100 W, high-efficiency pumps 5 to 25 W."
      kwhPerLitre:
        text: "Energy content of the heating oil (lower heating value)."
        source: "Material property, not to be adjusted."
        compare: "Heating oil EL: about 10 kWh per litre lower heating value, about 10.6 kWh per litre higher heating value."
        refs: [wiki-heizoel]

  building:
    title: "Building with thermostat"
    text: "The whole house as a single thermal zone. The room temperature rises with what boiler, stove, appliances and sun bring in, and falls with the loss through walls, windows and ventilation. At the end of every hour the thermostat computes how much heat the next hour needs to reach the setpoint, and reports it to the boiler. During the day the setpoint applies, at night the setback. If the daily mean of the outdoor temperature is above the heating limit, the heating season ends."
    capture: "Not a single device. Record the year of construction, living area, state of refurbishment (windows, roof, facade) and, if available, the figures from the energy performance certificate. Thermostat or heating controller with type and setting belong here too."
    ports:
      t_out_c: "Outdoor temperature from the weather."
      ghi_w_m2: "Global irradiance from the weather."
      q_heater_kw: "Space heat from the oil boiler."
      q_stove_kw: "Heat from the wood stove."
      q_gain_kw: "Waste heat of the appliances and the residents."
      setpoint_c: "Free input for a setpoint given from outside, for example from a smart home thermostat. Without a binding the control of the same name applies."
      t_in_c: "Room temperature at the end of the hour, the measure of comfort."
      q_req_kw: "Heat request to the boiler for the next hour."
      season: "1 in the heating season, otherwise 0."
      q_loss_kw: "Heat loss through the envelope and ventilation in this hour."
    controls:
      setpoint_c: "Room setpoint during the day. 1 K less saves about 150 litres of oil a year in the example."
      setback_k: "Night setback in kelvin below the day setpoint. In a house with this much thermal mass it hardly works, because it cools down by only 1 to 2 K in eight hours."
      unused_setback_k: "Setback in rarely used rooms, weighted with their share of the area."
    params:
      areaM2:
        text: "Heated living area. It is used only for the figure kWh per square metre and year."
        source: "Living area calculation, floor plan or energy performance certificate."
        compare: "Example: 130 m²."
      lossWPerK:
        text: "Heat loss coefficient H: watts of loss per kelvin difference between inside and outside, transmission and ventilation together. The most important parameter of the whole model."
        source: "Best from the calibration against bills. As a start value: annual space heat in kWh divided by (degree days times 24 h), times 1000. Or from the energy performance certificate or a heating load calculation: heating load divided by (20 °C minus the design outdoor temperature)."
        compare: "For about 130 m²: unrefurbished old building roughly 300 to 450 W/K, partly refurbished 180 to 280, new building 100 to 150, passive house below 60."
        refs: [iwu-tabula, tabula-webtool, wiki-heizlast, iwu-gradtage]
      capacityKwhPerK:
        text: "Effective heat capacity: energy the house stores per kelvin. Together with H it gives the time constant, here 14 kWh/K divided by 0.2 kW/K, that is 70 hours."
        source: "Estimate from the type of construction. More precisely: switch off the heating on a cold evening and record the room temperature overnight. The cooling curve gives the time constant."
        compare: "Standard values from thermal protection standards: light construction about 15 Wh per K and m³ of building volume, heavy construction about 50. At 400 m³ this is 6 to 20 kWh/K."
      solarApertureM2:
        text: "Effective solar area: window area times solar energy transmittance times a reduction for frames, shading and orientation."
        source: "Measure the window areas. Example calculation: 20 m² times 0.6 times 0.35 gives about 4 m²."
        compare: "Mostly 2 to 4 percent of the living area. Limit of the model: it computes with the irradiance on the horizontal and therefore underestimates the gains through south windows in winter."
        refs: [pvgis]
      heatingLimitC:
        text: "Heating limit: if the 24 hour mean of the outdoor temperature is above it, the house is not heated."
        source: "Setting of the heating controller (summer and winter switchover)."
        compare: "Old buildings about 15 °C, well insulated houses 12 °C, passive houses about 10 °C."
        refs: [wiki-heizgrenze]
      setpointC:
        text: "Start value of the control room setpoint during the day."
        source: "Read the thermostat or put a room thermometer into the living room."
        compare: "20 to 22 °C is usual."
      setbackK:
        text: "Start value of the control night setback."
        source: "Read the heating controller."
        compare: "2 to 4 K is usual."
      dayStartH:
        text: "Start of day operation."
        source: "Time program of the heating controller."
        compare: "Example: 6:00."
      dayEndH:
        text: "End of day operation, start of the night setback."
        source: "Time program of the heating controller."
        compare: "Example: 22:00."
      unusedShare:
        text: "Share of the area in rarely used rooms."
        source: "Area of these rooms divided by the living area."
        compare: "Example: 0.2 (study and guest room, 26 of 130 m²)."
      unusedSetbackK:
        text: "Start value of the setback in rarely used rooms."
        source: "Setting of the radiator thermostats in these rooms."
        compare: "0 means: all rooms equally warm."
      t0C:
        text: "Room temperature at the start of the run."
        source: "Start condition. After a few days it has no influence any more."
        compare: "Example: 20 °C."
      tAvg0C:
        text: "24 hour mean of the outdoor temperature at the start of the run."
        source: "Start condition. 0 °C fits the start of the year."
        compare: "Example: 0 °C."

  meter:
    title: "Electricity meter"
    text: "The power balance of the house: household appliances plus heating electricity give the draw from the grid. The block computes the cost, the highest hourly power and the night base load from it. Once a real meter value is bound, the residual shows how far model and measurement are apart."
    capture: "Meter number, meter type (Ferraris, modern metering device, smart meter), metering operator and tariff with energy price and standing charge."
    ports:
      p_appl_kw: "Electricity of the household appliances."
      p_heating_kw: "Electricity of the heating: circulation pump and burner."
      p_meas_kw: "Free input for the power measured at the meter, for example from photos of the meter or a smart meter."
      price_eur_kwh: "Free input for an electricity price that changes over time. Without a binding the fixed price priceEurKwh applies."
      p_import_kw: "Draw from the grid in this hour."
      residual_kw: "Measured minus computed draw. Present only when p_meas_kw is bound."
    params:
      priceEurKwh:
        text: "Energy price of electricity."
        source: "Your own electricity bill, gross energy price without standing charge."
        compare: "Household electricity in Germany recently about 0.30 to 0.42 EUR per kWh."
        refs: [bdew-strompreis]
      baseFromH:
        text: "Start of the night window in which the base load is measured."
        source: "Convention. The window should be free of deliberate use."
        compare: "Example: 2:00."
      baseToH:
        text: "End of the night window for the base load."
        source: "Convention."
        compare: "Example: 5:00. The base load of the example house is 156 W."
        refs: [stromspiegel]

  tank:
    title: "Oil tank"
    text: "The oil stock in litres. The boiler draws from it, deliveries fill it up. Deliveries are interventions with date and amount. The block warns when the level falls below the reorder threshold and reports an empty tank. Once a dipstick reading is bound, the residual shows the deviation between reading and model."
    capture: "Tank type (battery tank, underground tank), manufacturer, year of construction, nominal volume from the nameplate, number of containers and the date of the last tank inspection or cleaning."
    ports:
      fuel_lph: "Oil drawn by the boiler."
      level_meas_l: "Free input for the level read: dipstick, tank gauge or level sensor."
      level_l: "Computed level."
      residual_l: "Read minus computed level. Present only when level_meas_l is bound."
    controls:
      delivery_lph: "Delivery as inflow in litres per hour, set for exactly one hour. A delivery of 2,000 litres is 2,000 l/h for one hour."
    params:
      capacityL:
        text: "Capacity. A delivery beyond it is reported as overfill."
        source: "Nameplate of the tank or tank record."
        compare: "Single-family houses mostly have 2,000 to 6,000 litres. About 95 percent of the nominal volume is usable."
      level0L:
        text: "Level at the start of the run."
        source: "Read the dipstick or the tank gauge on the reference date."
        compare: "Example: 1,500 litres on 1 January."
      reorderL:
        text: "Reorder threshold. Below it a warning appears."
        source: "Your own decision: consumption of the coldest weeks times delivery time, plus a reserve. Below about 10 percent level, sediment can be drawn in."
        compare: "The example house uses about 10 litres a day in January. 600 litres then last about 8 weeks."
      priceEurL:
        text: "Heating oil price per litre."
        source: "Last delivery bill, gross price per litre."
        compare: "Daily prices and price history on the price portals."
        refs: [tecson-heizoel]

  woodstore:
    title: "Wood store"
    text: "The wood stock in Ster. The stove draws from it, deliveries or your own felling fill it up. If the stock falls below the warning threshold, an event is raised. The stock may become negative in the computation. This then shows that the assumed burning is not covered by the stored wood."
    capture: "No device. Record the wood species, the supplier or your own woodland, the storage place and the year of storage (air-dry after about two years)."
    ports:
      wood_ster_ph: "Wood drawn by the stove."
      stock_ster: "Stock in Ster."
    controls:
      delivery_ster_ph: "Delivery as inflow in Ster per hour, set for exactly one hour."
    params:
      stock0Ster:
        text: "Stock at the start of the run."
        source: "Measure the stack: length times height times log length in metres gives Ster."
        compare: "Example: 4 Ster."
      lowSter:
        text: "Warning threshold for the stock."
        source: "Your own decision."
        compare: "Example: 1 Ster; at 4 hours per evening it lasts about two months."
      priceEurSter:
        text: "Wood price per Ster."
        source: "Bill of the supplier. For your own felling use your own costs."
        compare: "Strongly regional. Hardwood is more expensive than spruce."
        refs: [lwf-holz]

wires:
  "weather.t_out_c -> building.t_out_c": "The outdoor temperature drives the whole heat balance. Every hour the building loses H times (inside minus outside). At 21.2 °C inside and minus 1.3 °C outside this is 200 W/K times 22.5 K, that is 4.5 kW. From the 24 hour mean of this temperature the building also decides whether it is heating season. With real station data at the weather input this line becomes a measurement."
  "weather.ghi_w_m2 -> building.ghi_w_m2": "The sun heats through the windows too. The building computes irradiance times effective solar area: 300 W/m² times 4 m² gives a gain of 1.2 kW. On sunny winter days this lowers the request to the boiler; at night the value is 0."
  "building.q_req_kw -> boiler.q_req_kw": "The line from the thermostat to the boiler. At the end of every hour the building computes: how much heat does the next hour need to reach the setpoint that then applies? Heating up plus loss, minus what appliances, sun and stove deliver anyway. Dashed, because the value arrives at the boiler only in the following hour. The boiler delivers at most what is left of its rated power after the hot water."
  "building.season -> boiler.season": "Tells the boiler whether it is heating season (1) or not (0). What counts is the 24 hour mean of the outdoor temperature against the heating limit of 15 °C. The boiler switches the circulation pump with it: in the heating season it runs continuously and draws 65 W, in summer it stands still. Dashed, because the signal comes from the previous hour."
  "building.season -> stove.season": "The same heating season signal for the wood stove. Only in the heating season is the fire lit in the evening, in the example from 18:00 to 22:00. Dashed, because the signal comes from the previous hour."
  "dhw.q_dhw_kw -> boiler.q_dhw_kw": "The heat demand for hot water: draws in the morning and the evening plus the loss of the cylinder at 60 °C around the clock. The boiler serves it before space heating. Two persons with 40 litres a day each need about 3.3 kWh; the cylinder loss adds about 1.4 kWh a day. This line carries power all year, also in summer."
  "tank.level_l -> boiler.tank_level_l": "The level of the tank as a safety signal. As long as there is oil, nothing changes. If the level falls to zero, the boiler delivers no more heat and reports the event fuel_out, and the house cools down. Dashed, because the boiler sees the level from the end of the previous hour."
  "boiler.q_space_kw -> building.q_heater_kw": "The heat the boiler brings into the house through the radiators. It follows the request of the thermostat, limited by the rated power of 18 kW minus the hot water. In summer and with an empty tank the value is 0. This power costs oil: divided by the efficiency it gives the fuel demand."
  "stove.q_heat_kw -> building.q_stove_kw": "The heat of the wood stove, directly into the living zone. While burning it is 6 kW of fuel times 0.70 efficiency, that is 4.2 kW. The thermostat subtracts this heat from its request, and the boiler has to deliver correspondingly less. This is the coupling between wood and oil."
  "appliances.q_gain_kw -> building.q_gain_kw": "The internal heat gains. Every kilowatt hour of electricity used inside the heated rooms ends up as heat in the room. Add 80 W per person at home. The freezer in the cellar does not count, because it stands outside the envelope. Here lies an important coupling: whoever saves electricity in winter needs a little more oil."
  "appliances.p_el_kw -> meter.p_appl_kw": "The household electricity from the appliance inventory, hour by hour, including standby. At the meter it is added to the heating electricity. In the example year it is about 2,300 kWh."
  "boiler.p_el_kw -> meter.p_heating_kw": "The electricity the heating itself needs: the circulation pump with 65 W during the whole heating season and the burner with 120 W while it fires. In the example year the model computes about 700 kWh for it, almost a quarter of all electricity. The model sets the burner share rather high, because it derives the running time from the minimum load. The pump share of about 490 kWh is not affected, so replacing the pump remains one of the most effective levers."
  "boiler.fuel_lph -> tank.fuel_lph": "The oil consumption of the boiler in litres per hour. It comes from the heat delivered divided by the efficiency, plus 0.2 kW of standby loss, divided by 10 kWh per litre. The tank subtracts this amount from its level and computes the cost with the oil price. Even without heat demand about 0.02 litres per hour flow because of the standby."
  "stove.wood_ster_ph -> woodstore.wood_ster_ph": "The wood consumption of the stove in Ster per hour: 6 kW of fuel power divided by 1,500 kWh per Ster gives 0.004 Ster per hour of burning. An evening of four hours costs 0.016 Ster, a heating season almost 5 Ster. The wood store subtracts the amount from the stock and computes the cost."


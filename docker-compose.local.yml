
# Local development environment for OpenTSx: PostgreSQL, Kafka (KRaft, no ZooKeeper) and Schema Registry.
# The profile full adds the SaaS backend and frontend.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: opentsx-postgres
    environment:
      POSTGRES_USER: opentsx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see opentsx-saas-backend/DOCKER-SETUP.md}
      POSTGRES_DB: opentsx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opentsx-network

  # Kafka (KRaft, one node that is broker and controller) and Schema Registry of Confluent Platform 7.6.0.
  # No security configured for local testing.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: opentsx-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - opentsx-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: opentsx-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    networks:
      - opentsx-network

  # Backend API (Optional - requires backend implementation)
  backend:
    build:
      context: ./opentsx-saas-backend
      dockerfile: Dockerfile
    container_name: opentsx-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=opentsx
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see opentsx-saas-backend/DOCKER-SETUP.md}
      - POSTGRES_DB=opentsx
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY, see opentsx-saas-backend/DOCKER-SETUP.md}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?set FIRST_SUPERUSER_PASSWORD, see opentsx-saas-backend/DOCKER-SETUP.md}
    volumes:
      - ./opentsx-saas-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - opentsx-network
    profiles:
      - full  # Only start with --profile full

  # Frontend UI (Optional - requires frontend implementation)
  frontend:
    build:
      context: ./opentsx-saas-frontend
      dockerfile: Dockerfile
    container_name: opentsx-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./opentsx-saas-frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - opentsx-network
    profiles:
      - full  # Only start with --profile full

volumes:
  postgres_data:
    name: opentsx-postgres-data
  kafka_data:
    name: opentsx-kafka-data

networks:
  opentsx-network:
    name: opentsx-network
    driver: bridge

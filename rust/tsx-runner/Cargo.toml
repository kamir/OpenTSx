[package]
name = "tsx-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "Apache-2.0"
description = "Bounded whole-topic execution of OpenTSx cleaning fragments"

[dependencies]
tsx-contracts = { path = "../tsx-contracts", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
xxhash-rust = { version = "=0.8.19", features = ["xxh64"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["zstd"] }
tiny_http = { version = "=0.12.0", default-features = false }

# Cost specifications of the OpenTSx operators on Wayang's Java platform. The values of all four are those of
# wayang.java.kafkatopicsource.load and wayang.java.kafkatopicsink.load in Wayang 1.1.1
# (wayang-java-defaults.properties:490-516), with in and out of the sink corrected (Wayang gives the sink in 0, out 1);
# they are replaced by measured values in TASK-020 (A1.7).
wayang.java.tsx.topicsource.load = {\
  "in":0, "out":1,\
  "cpu":"${425*out0 + 1400000}",\
  "ram":"${100*out0}",\
  "p":0.9\
}
wayang.java.tsx.topicsink.load = {\
  "in":1, "out":0,\
  "cpu":"${425*in0 + 1400000}",\
  "ram":"${100*in0}",\
  "p":0.9\
}
wayang.java.tsx.serieschain.load = {\
  "in":1, "out":1,\
  "cpu":"${425*in0 + 1400000}",\
  "ram":"${100*in0}",\
  "p":0.9\
}
wayang.java.tsx.statswindow.load = {\
  "in":1, "out":1,\
  "cpu":"${425*in0 + 1400000}",\
  "ram":"${100*in0}",\
  "p":0.9\
}
